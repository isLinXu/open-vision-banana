    <text x="360" y="172" text-anchor="middle" fill="#5c5c66">legend in the prompt</text>
    <text x="360" y="204" text-anchor="middle" font-size="12" fill="#5c5c66">paper §3.1–3.2, verified</text>
  </g>
  <line x1="455" y1="145" x2="497" y2="145" stroke="#5c5c66" stroke-width="2" marker-end="url(#a)"/>
  <g>
    <rect x="500" y="40" width="240" height="210" rx="14" fill="#e9f0fb" stroke="#2b6cb0" stroke-width="1.5"/>
