<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5c5c66"/></marker></defs>
  <rect width="1200" height="300" fill="#ffffff"/>
  <g>
    <rect x="20" y="70" width="200" height="150" rx="12" fill="#fff8dc" stroke="#d9a400"/>
