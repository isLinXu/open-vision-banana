    <text x="120" y="172" text-anchor="middle" fill="#5c5c66">referring mask</text>
    <text x="120" y="204" text-anchor="middle" font-size="12" fill="#9a6700">Hypersim · TartanAir · COCO · ADE20K · RefCOCO</text>
  </g>
  <line x1="220" y1="145" x2="262" y2="145" stroke="#5c5c66" stroke-width="2" marker-end="url(#a)"/>
