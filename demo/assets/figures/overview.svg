    <text x="620" y="150" text-anchor="middle" fill="#5c5c66">+ reference latents</text>
    <text x="620" y="180" text-anchor="middle" fill="#5c5c66">LoRA instruction-tuning</text>
    <text x="620" y="202" text-anchor="middle" fill="#5c5c66">mixed with generation replay</text>
    <text x="620" y="232" text-anchor="middle" font-size="12" fill="#2b6cb0">one weight · prompt selects the task</text>
  </g>
  <line x1="740" y1="145" x2="782" y2="145" stroke="#5c5c66" stroke-width="2" marker-end="url(#a)"/>
  <g>
    <rect x="785" y="70" width="190" height="150" rx="12" fill="#f3f0e6" stroke="#bfb8a3"/>
    <text x="880" y="100" text-anchor="middle" font-weight="700">Decoder</text>
    <text x="880" y="128" text-anchor="middle" fill="#5c5c66">inverse colormap → metres</text>
    <text x="880" y="150" text-anchor="middle" fill="#5c5c66">nearest legend colour</text>
    <text x="880" y="172" text-anchor="middle" fill="#5c5c66">Appendix A clustering</text>
    <text x="880" y="204" text-anchor="middle" font-size="12" fill="#5c5c66">τ=14 · 16-conn · γ=5</text>
  </g>
  <line x1="975" y1="145" x2="1017" y2="145" stroke="#5c5c66" stroke-width="2" marker-end="url(#a)"/>
  <g>
