name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev tools
        run: pip install ruff==0.11.4 mypy==1.19.1
      - name: Lint with ruff
        run: ruff check src/ tests/ scripts/
      - name: Format check with ruff
        run: ruff format --check src/ tests/ scripts/ experiments/
      - name: Type check with mypy
        run: mypy src/ --ignore-missing-imports --no-strict-optional

  test:
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      WANDB_MODE: offline
      MPLBACKEND: Agg
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[ci]"
      - name: Run complete CPU test suite
        run: |
          python -m pytest tests/ -v \
            --cov=src/open_vision_banana \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=70 \
            --junitxml=test-results.xml
      - name: Upload coverage artifact
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            test-results.xml

  e2e:
    runs-on: ubuntu-latest
    needs: test
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU export dependencies
        run: |
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[export,dev]"
      - name: Run end-to-end tests
        run: python -m pytest tests/test_e2e.py tests/test_onnx_export.py -v

  multi-backbone-validate:
    runs-on: ubuntu-latest
    needs: test
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU validation dependencies
        run: |
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[evaluation]" peft matplotlib seaborn
      - name: Validate multi-backbone training paths (mock)
        run: python scripts/validate_multi_backbone_training.py
      - name: Validate core algorithm benchmark (no GPU)
        run: python experiments/core_algorithm_benchmark.py
      - name: Validate colormap quantization experiment (no GPU)
        run: python experiments/colormap_quantization_experiment.py

  smoke-train:
    runs-on: ubuntu-latest
    needs: test
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      WANDB_MODE: offline
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU smoke dependencies
        run: |
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[inference,dev]" peft tensorboard
      - name: Build synthetic generation dataset
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          from open_vision_banana.data.generation import build_generation_dataset
          from open_vision_banana.data.generation_builder import build_synthetic_generation_dataset

          root = build_synthetic_generation_dataset(
              Path(os.environ["RUNNER_TEMP"]) / "gen_data",
              num_samples=8, resolution=32, seed=42,
          )
          dataset = build_generation_dataset(
              root, resolution=32, require_captions=True, include_input_image=True,
          )
          assert len(dataset) == 8
          for sample in dataset:
              assert sample["image"].shape == (3, 32, 32)
              assert sample["target_rgb"].shape == (3, 32, 32)
              assert sample["prompt"].strip()
          PY
      - name: Run training smoke test
        run: python scripts/train_smoke.py --device cpu --epochs 1 --batch-size 2 --resolution 32 --num-samples 16

  docker-build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t open-vision-banana:ci -f docker/Dockerfile .
      - name: Verify container imports
        run: |
          docker run --rm open-vision-banana:ci \
            python -c "from open_vision_banana.core import DepthRGBMapper; print('ok')"
