name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev tools
        run: pip install ruff mypy
      - name: Lint with ruff
        run: ruff check src/ tests/ scripts/
      - name: Format check with ruff
        run: ruff format --check src/ tests/ scripts/ experiments/
      - name: Type check with mypy
        run: mypy src/ --ignore-missing-imports --no-strict-optional

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with core + evaluation deps
        run: pip install -e ".[evaluation,dev]"
      - name: Run unit tests (skip optional-dependency tests)
        run: |
          python -m pytest tests/ -v \
            --ignore=tests/test_e2e.py \
            --ignore=tests/test_onnx_export.py \
            --ignore=tests/test_generation_builder.py \
            --ignore=tests/test_training_features.py \
            --cov=open_vision_banana \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=70
      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package with all extras
        run: pip install -e ".[all]"
      - name: Run end-to-end tests
        run: python -m pytest tests/test_e2e.py tests/test_onnx_export.py -v

  multi-backbone-validate:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install core deps only
        run: pip install -e ".[evaluation]"
      - name: Validate multi-backbone training paths (mock)
        run: python scripts/validate_multi_backbone_training.py
      - name: Validate core algorithm benchmark (no GPU)
        run: python experiments/core_algorithm_benchmark.py
      - name: Validate colormap quantization experiment (no GPU)
        run: python experiments/colormap_quantization_experiment.py

  smoke-train:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package with training extras
        run: pip install -e ".[training,dev]"
      - name: Build synthetic generation dataset
        run: |
          python scripts/build_generation_dataset.py \
            --output-dir /tmp/gen_data --num-samples 8 --resolution 32 --validate
      - name: Run training smoke test
        run: python scripts/train_smoke.py --device cpu --epochs 1 --batch-size 2 --resolution 32 --num-samples 16

  docker-build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t open-vision-banana:ci -f docker/Dockerfile .
      - name: Verify container imports
        run: |
          docker run --rm open-vision-banana:ci \
            python -c "from open_vision_banana.core import DepthRGBMapper; print('ok')"
