name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Lint with ruff
        run: ruff check src/
      - name: Format check with ruff
        run: ruff format --check src/ tests/ scripts/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with all extras
        run: pip install -e ".[all]"
      - name: Run unit tests with coverage
        run: |
          python -m pytest tests/ -v \
            --cov=open_vision_banana \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=80
      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[all]"
      - name: Run end-to-end tests
        run: python -m pytest tests/test_e2e.py -v

  export-check:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install export extras
        run: pip install -e ".[export]"
      - name: Verify ONNX export
        run: python scripts/export_onnx.py --output-dir output/onnx

  smoke-train:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package with training extras
        run: pip install -e ".[training,dev]"
      - name: Build synthetic generation dataset
        run: |
          python scripts/build_generation_dataset.py \
            --output-dir /tmp/gen_data --num-samples 8 --resolution 32 --validate
      - name: Run training smoke test
        run: python scripts/train_smoke.py --device cpu --epochs 1 --batch-size 2 --resolution 32 --num-samples 16

  docker-build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t open-vision-banana:ci -f docker/Dockerfile .
      - name: Verify container imports
        run: |
          docker run --rm open-vision-banana:ci \
            python -c "from open_vision_banana.core import DepthRGBMapper; print('ok')"
