name: Performance Regression

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/benchmark.py"
      - "scripts/benchmark_pipeline.py"
      - "scripts/compare_benchmarks.py"
      - ".github/workflows/performance_regression.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/benchmark.py"
      - "scripts/benchmark_pipeline.py"
      - "scripts/compare_benchmarks.py"
      - ".github/workflows/performance_regression.yml"
  workflow_dispatch:

env:
  BENCHMARK_RESULTS_DIR: .benchmarks
  REGRESSION_THRESHOLD: "0.15"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  benchmark-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out exact PR base for a measured baseline
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .benchmark-base

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with core deps
        run: |
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[evaluation,dev]"

      - name: Measure PR base using the same driver and runner
        if: github.event_name == 'pull_request'
        env:
          PYTHONPATH: ${{ github.workspace }}/.benchmark-base/src
        run: |
          mkdir -p "${BENCHMARK_RESULTS_DIR}"
          git -C .benchmark-base rev-parse HEAD > "${BENCHMARK_RESULTS_DIR}/base_revision.txt"
          python scripts/benchmark.py --resolution 256 --iterations 20 --device cpu \
            --output "${BENCHMARK_RESULTS_DIR}/core_benchmark_baseline.json"

      - name: Run core benchmark (CPU)
        run: |
          mkdir -p "${BENCHMARK_RESULTS_DIR}"
          python scripts/benchmark.py \
            --resolution 256 \
            --iterations 20 \
            --device cpu \
            --output "${BENCHMARK_RESULTS_DIR}/core_benchmark_current.json" \
            > "${BENCHMARK_RESULTS_DIR}/core_benchmark_current.txt"

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: core-benchmark-current
          if-no-files-found: error
          path: |
            .benchmarks/core_benchmark_current.json
            .benchmarks/core_benchmark_current.txt
            .benchmarks/core_benchmark_baseline.json
            .benchmarks/base_revision.txt

  benchmark-mapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out exact PR base for a measured baseline
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .benchmark-base

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with core deps
        run: |
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[evaluation,dev]"

      - name: Measure PR base using the same driver and runner
        if: github.event_name == 'pull_request'
        env:
          PYTHONPATH: ${{ github.workspace }}/.benchmark-base/src
        run: |
          python scripts/benchmark_pipeline.py --mapper-only --resolution 256 \
            --num-samples 20 --batch-size 1 --device cpu \
            --output "${BENCHMARK_RESULTS_DIR}/mapper_benchmark_baseline.json"

      - name: Run mapper-only pipeline benchmark
        run: |
          python scripts/benchmark_pipeline.py \
            --mapper-only \
            --resolution 256 \
            --num-samples 20 \
            --batch-size 1 \
            --device cpu \
            --output "${BENCHMARK_RESULTS_DIR}/mapper_benchmark_current.json"

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: mapper-benchmark-current
          if-no-files-found: error
          path: |
            .benchmarks/mapper_benchmark_current.json
            .benchmarks/mapper_benchmark_baseline.json

  compare-regression:
    runs-on: ubuntu-latest
    needs: [benchmark-core, benchmark-mapper]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download current core benchmark
        uses: actions/download-artifact@v4
        with:
          name: core-benchmark-current
          path: .benchmarks/current

      - name: Download current mapper benchmark
        uses: actions/download-artifact@v4
        with:
          name: mapper-benchmark-current
          path: .benchmarks/current

      - name: Restore baseline from cache
        if: github.event_name != 'pull_request'
        id: cache-baseline
        uses: actions/cache/restore@v4
        with:
          path: .benchmarks/baseline
          key: benchmark-baseline-v2-cpu-py312-main-${{ github.run_id }}
          restore-keys: |
            benchmark-baseline-v2-cpu-py312-main-

      - name: Use measured exact-base results for PRs
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p .benchmarks/baseline
          cp .benchmarks/current/core_benchmark_baseline.json .benchmarks/baseline/
          cp .benchmarks/current/mapper_benchmark_baseline.json .benchmarks/baseline/
          cat .benchmarks/current/base_revision.txt

      - name: Seed baseline if missing
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p .benchmarks/baseline
          if [ ! -f .benchmarks/baseline/core_benchmark_baseline.json ]; then
            echo "::notice::No compatible main-branch core baseline exists yet; recording initial measurements."
            echo '{}' > .benchmarks/baseline/core_benchmark_baseline.json
          fi
          if [ ! -f .benchmarks/baseline/mapper_benchmark_baseline.json ]; then
            echo "::notice::No compatible main-branch mapper baseline exists yet; recording initial measurements."
            echo '[]' > .benchmarks/baseline/mapper_benchmark_baseline.json
          fi

      - name: Compare core benchmark
        id: compare-core
        continue-on-error: true
        run: |
          bootstrap=()
          if [ "${{ github.event_name }}" != "pull_request" ]; then bootstrap=(--allow-empty-baseline); fi
          python scripts/compare_benchmarks.py \
            .benchmarks/baseline/core_benchmark_baseline.json \
            .benchmarks/current/core_benchmark_current.json \
            --threshold ${{ env.REGRESSION_THRESHOLD }} \
            --report .benchmarks/core_regression_report.md \
            --json  .benchmarks/core_regression_report.json "${bootstrap[@]}"

      - name: Compare mapper benchmark
        id: compare-mapper
        continue-on-error: true
        run: |
          bootstrap=()
          if [ "${{ github.event_name }}" != "pull_request" ]; then bootstrap=(--allow-empty-baseline); fi
          python scripts/compare_benchmarks.py \
            .benchmarks/baseline/mapper_benchmark_baseline.json \
            .benchmarks/current/mapper_benchmark_current.json \
            --threshold ${{ env.REGRESSION_THRESHOLD }} \
            --report .benchmarks/mapper_regression_report.md \
            --json  .benchmarks/mapper_regression_report.json "${bootstrap[@]}"

      - name: Print regression reports
        run: |
          echo "=== Core Regression Report ==="
          cat .benchmarks/core_regression_report.md || echo "No report generated."
          echo ""
          echo "=== Mapper Regression Report ==="
          cat .benchmarks/mapper_regression_report.md || echo "No report generated."

      - name: Fail on regression
        env:
          CORE_OUTCOME: ${{ steps.compare-core.outcome }}
          MAPPER_OUTCOME: ${{ steps.compare-mapper.outcome }}
        run: |
          if [ "$CORE_OUTCOME" != "success" ] || [ "$MAPPER_OUTCOME" != "success" ]; then
            echo "ERROR: Benchmark comparison failed or detected a regression."
            exit 1
          fi
          has_regression=0
          for f in .benchmarks/core_regression_report.json .benchmarks/mapper_regression_report.json; do
            if [ ! -f "$f" ]; then
              echo "ERROR: Missing required regression report: $f"
              exit 1
            else
              val=$(python -c "import json; print(json.load(open('$f'))['has_regression'])")
              if [ "$val" = "True" ]; then
                has_regression=1
                echo "Regression detected in $f"
              fi
            fi
          done
          if [ "$has_regression" -eq 1 ]; then
            echo "ERROR: Performance regression detected. See reports above."
            exit 1
          fi
          echo "No performance regressions detected."

      - name: Upload regression reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-reports
          path: |
            .benchmarks/*_report.md
            .benchmarks/*_report.json

  update-baseline:
    runs-on: ubuntu-latest
    needs: compare-regression
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Download current benchmarks
        uses: actions/download-artifact@v4
        with:
          name: core-benchmark-current
          path: .benchmarks/current

      - name: Download mapper benchmark
        uses: actions/download-artifact@v4
        with:
          name: mapper-benchmark-current
          path: .benchmarks/current

      - name: Save new baseline
        run: |
          mkdir -p .benchmarks/baseline
          cp .benchmarks/current/core_benchmark_current.json .benchmarks/baseline/core_benchmark_baseline.json
          cp .benchmarks/current/mapper_benchmark_current.json .benchmarks/baseline/mapper_benchmark_baseline.json

      - name: Cache successful main baseline
        uses: actions/cache/save@v4
        with:
          path: .benchmarks/baseline
          key: benchmark-baseline-v2-cpu-py312-main-${{ github.run_id }}
