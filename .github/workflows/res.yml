name: RES Contract

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/res.yml"
      - ".coveragerc-res"
      - ".mypy-res.ini"
      - "pyproject.toml"
      - "src/open_vision_banana/referring*.py"
      - "src/open_vision_banana/res_*.py"
      - "src/open_vision_banana/core/referring.py"
      - "src/open_vision_banana/data/res_*.py"
      - "src/open_vision_banana/data/datasets.py"
      - "src/open_vision_banana/training/trainer.py"
      - "src/open_vision_banana/inference/decoder.py"
      - "src/open_vision_banana/inference/pipeline.py"
      - "src/open_vision_banana/inference/prompt.py"
      - "src/open_vision_banana/evaluation/evaluator.py"
      - "scripts/*res_manifest.py"
      - "scripts/*res_dataset.py"
      - "scripts/audit_res_mixed.py"
      - "scripts/evaluate_paper_benchmarks.py"
      - "tests/test_res_*.py"
      - "tests/test_referring_masks_strict.py"
      - "tests/test_normal_referring_benchmarks.py"
      - "configs/sana_res_binary_v1.yaml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/res.yml"
      - ".coveragerc-res"
      - ".mypy-res.ini"
      - "pyproject.toml"
      - "src/open_vision_banana/referring*.py"
      - "src/open_vision_banana/res_*.py"
      - "src/open_vision_banana/core/referring.py"
      - "src/open_vision_banana/data/res_*.py"
      - "src/open_vision_banana/data/datasets.py"
      - "src/open_vision_banana/training/trainer.py"
      - "src/open_vision_banana/inference/decoder.py"
      - "src/open_vision_banana/inference/pipeline.py"
      - "src/open_vision_banana/inference/prompt.py"
      - "src/open_vision_banana/evaluation/evaluator.py"
      - "scripts/*res_manifest.py"
      - "scripts/*res_dataset.py"
      - "scripts/audit_res_mixed.py"
      - "scripts/evaluate_paper_benchmarks.py"
      - "tests/test_res_*.py"
      - "tests/test_referring_masks_strict.py"
      - "tests/test_normal_referring_benchmarks.py"
      - "configs/sana_res_binary_v1.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  res-contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      WANDB_MODE: disabled
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[inference,evaluation,data,dev]"
          python -m pip install ruff==0.11.4 mypy==1.19.1
      - name: Require real data decoders
        run: python -c "import ijson, pycocotools.mask, scipy"
      - name: Lint and format RES modules and tools
        shell: bash
        run: |
          files=(
            src/open_vision_banana/referring_contract.py
            src/open_vision_banana/referring_masks.py
            src/open_vision_banana/core/referring.py
            src/open_vision_banana/data/res_*.py
            src/open_vision_banana/res_*.py
            scripts/build_res_manifest.py scripts/validate_res_manifest.py
            scripts/package_res_dataset.py scripts/download_res_dataset.py
            scripts/evaluate_res_manifest.py
            scripts/audit_res_mixed.py
            tests/test_res_*.py tests/test_referring_masks_strict.py
          )
          ruff check "${files[@]}"
          ruff format --check "${files[@]}"
      - name: Type check RES modules
        run: |
          mypy --config-file .mypy-res.ini --python-version ${{ matrix.python-version }} \
            src/open_vision_banana/referring_contract.py \
            src/open_vision_banana/referring_masks.py \
            src/open_vision_banana/core/referring.py \
            src/open_vision_banana/data/res_contract.py \
            src/open_vision_banana/data/res_dataset.py \
            src/open_vision_banana/res_manifest.py \
            src/open_vision_banana/res_bundle.py \
            src/open_vision_banana/res_training_view.py \
            src/open_vision_banana/res_mixed.py
      - name: Verify RES and adjacent benchmark contracts
        run: |
          python -m pytest \
            tests/test_res_training_contract.py \
            tests/test_res_training_view.py \
            tests/test_res_mixed.py \
            tests/test_res_manifest_builder.py \
            tests/test_res_bundle.py \
            tests/test_res_manifest_dataset.py \
            tests/test_res_inference_contract.py \
            tests/test_referring_masks_strict.py \
            tests/test_normal_referring_benchmarks.py \
            --cov --cov-config=.coveragerc-res \
            --cov-report=term-missing --cov-report=xml:coverage-res.xml \
            --junitxml=junit-res.xml
      - name: Upload RES evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: res-evidence-python-${{ matrix.python-version }}
          path: |
            coverage-res.xml
            junit-res.xml
          if-no-files-found: warn
