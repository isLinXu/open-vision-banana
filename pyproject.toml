[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-vision-banana"
dynamic = ["version"]
description = "Image Generators are Generalist Vision Learners — Open-source implementation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Open Vision Banana Contributors"},
]
keywords = ["vision", "diffusion", "flux", "lora", "depth", "segmentation", "normals"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "pyyaml>=6.0",
    "pillow>=9.0",
    "safetensors>=0.4",
]

[project.optional-dependencies]
inference = [
    "diffusers>=0.30",
    "transformers>=4.40",
    "accelerate>=0.25",
    "huggingface_hub>=0.20",
    # T5 tokenizers (FLUX tokenizer_2, SD3 tokenizer_3) need sentencepiece + protobuf.
    "sentencepiece>=0.1.99",
    "protobuf>=3.20",
]
training = [
    "open-vision-banana[inference]",
    "peft>=0.10",
    "wandb>=0.16",
    # quantize: "4bit" (the FLUX.1-dev configs) loads through BitsAndBytesConfig.
    "bitsandbytes>=0.43; platform_system != 'Darwin'",
]
deepspeed = [
    "open-vision-banana[training]",
    "deepspeed>=0.14",
]
export = [
    "onnx>=1.15",
    "onnxruntime>=1.16",
]
evaluation = [
    "scipy>=1.10",
    "pycocotools>=2.0.7",
    "lpips>=0.1.4",
]
data = [
    "h5py>=3.8",
]
serving = [
    "fastapi>=0.100",
    "uvicorn>=0.23",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.10",
]
all = [
    "open-vision-banana[inference,training,export,evaluation,data,serving,dev,deepspeed]",
]

[project.urls]
Repository = "https://github.com/isLinXu/open-vision-banana"

[tool.setuptools.dynamic]
version = {attr = "open_vision_banana.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["open_vision_banana*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["experiments", "notebooks", "scripts", ".session_tmps"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501", "B008", "N806", "N812", "N817", "E702"]

[tool.ruff.lint.isort]
known-first-party = ["open_vision_banana"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
no_strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
check_untyped_defs = true
show_error_codes = true
exclude = ["scripts", "experiments", "notebooks", ".session_tmps"]
# Relax strictness on common PyTorch patterns where mypy's type inference
# is overly narrow (e.g. Tensor vs Module unions, float|int indexing).
disable_error_code = ["index", "operator", "arg-type", "call-overload"]
