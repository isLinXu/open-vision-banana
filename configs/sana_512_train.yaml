# Open-Vision-Banana -- Sana_600M_512px Vision-Banana reproduction
#
# Run from the repository root:
#   python scripts/train_sana_512.py --config configs/sana_512_train.yaml
#
# One prompt-conditioned SANA LoRA learns every task as an RGB image. Vision
# examples use source-image -> task-target flow; preservation examples use
# text/noise -> image flow, keeping the generator's native capability alive.

model:
  name: sana-600m-512px
  model_id: Efficient-Large-Model/Sana_600M_512px_diffusers
  dtype: float16
  resolution: 512

lora:
  rank: 32
  alpha: 64
  rs_lora: true
  target_modules:
    - linear
    - proj_out
    - conv_inverted
    - conv_point

data:
  # v5_full is flat; always use the annotation-backed pair manifest.
  dir: /Users/gatilin/PycharmProjects/open-vision-banana/data/vb_snvc_train_v5_full
  pair_manifest: output/mar_vb_clean_pairs_v4/pairs.jsonl
  generation_dir: /Users/gatilin/PycharmProjects/open-vision-banana/data/vb_generation_5k
  resolution: 512
  # Vision Banana style: 10% visual instruction tuning / 90% generation retention.
  vision_ratio: 0.1
  num_workers: 0
  tasks:
    - depth
    - normal
    - segmentation
    - structure
  task_weights: uniform

training:
  steps: 10000
  batch_size: 1
  gradient_accumulation: 8
  lr: 5.0e-5
  max_grad_norm: 1.0
  seed: 42
  gradient_checkpointing: true

scheduler:
  type: cosine
  warmup_ratio: 0.05
  warmup_steps: null

flow:
  img2img_flow: true
  sigma: 0.0
  logit_normal_timesteps: true
  min_snr: true
  min_snr_gamma: 5.0
  cfg_dropout_rate: 0.1

ema:
  enabled: true
  decay: 0.9999
  warmup_steps: 500

checkpoint:
  output_dir: output/sana_v5_vision_banana
  save_every: 1000
  eval_every: 500
  log_every: 50

device: mps
resume: null
