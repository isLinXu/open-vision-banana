# FLUX.1-schnell 深度估计训练配置
# ================================
# 符合 vision-banana 论文要求：纯深度估计数据集训练
# 数据集: data/vb_depth_pseudo_5k (5000 样本)

model:
  name: "/Users/gatilin/MyWork/models/ckpts/FLUX.1-schnell"
  dtype: "bfloat16"

lora:
  rank: 64
  alpha: 128
  rs_lora: true
  target_modules:
    - "to_k"
    - "to_v"
  dropout: 0.0

optimizer:
  lr: 5.0e-5
  weight_decay: 0.01
  scheduler: "cosine"
  warmup_steps: 100
  max_grad_norm: 1.0

output_dir: "output/checkpoints_flux_depth"

logging:
  wandb_enabled: false
  tensorboard_enabled: true
  tensorboard_dir: "output/runs_flux_depth"
  run_name: "flux_depth_train"

training:
  epochs: 3
  gradient_accumulation_steps: 4
  use_amp: false
  use_ema: false
  save_every: 50
  eval_every: 999           # disable eval during training
  max_keep: 3
  seed: 42
  log_every: 10
  early_stopping_patience: null
  early_stopping_min_delta: 0.0

data:
  vision_ratio: 1.0          # 100% 视觉数据，不混合生成数据
  generation_ratio: 0.0
  resolution: 512
  batch_size: 1
  num_workers: 0
  augmentation: false
  val_split: 0.05
  # generation_path 不设置，纯深度估计训练

  tasks:
    depth_estimation:
      datasets:
        - name: "vb_depth_pseudo_5k"
          split: "train"

depth_mapping:
  lam: -3.0
  c: 3.333

normal_mapping: {}

segmentation:
  color_tolerance: 14.0
  min_area_fraction: 2.0e-4
  erosion_threshold: 0.1
  bbox_expansion_factor: 5.0
