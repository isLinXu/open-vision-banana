# FLUX.1-dev eight-task training config (Vision Banana reproduction: full SenseNova-Vision coverage)
# =====================================================================
# Model: FLUX.1-dev (12B transformer, 4-bit NF4 quantization)
# Data: SNVC-50M v5_full eight-task manifest (RGB parameterization)
#   depth + normal + semantic seg + object detection + keypoint +
#   referring seg + edge + depth_edge
#   targets are produced by scripts/gen_detpoint_refer_targets.py (coordinate rendering / Canny-derived / GT labelmap)
#   merged and checked by scripts/merge_multitask_manifest.py (keeps only rows whose files exist)
# Coverage: all 10 README tasks except optical flow / instance seg (no dataset GT for those two)
# Target: single RTX 4090 24GB LoRA fine-tuning, 30000 steps, synced to W&B

model:
  name: "flux-dev"
  dtype: "bfloat16"
  quantize: "4bit"  # scripts/train.py loads FLUX unquantized without this
  resolution: 512

lora:
  rank: 32
  alpha: 64
  rs_lora: true
  target_modules:
    - "to_q"
    - "to_k"
    - "to_v"
    - "to_out.0"
    - "proj_in"
    - "proj_out"
    - "ff.net.0.proj"
    - "ff.net.2"
  dropout: 0.0

data:
  dir: data/raw/open-vision-banana-snvc-train-full
  pair_manifest: output/snvc_v5full_pairs/pairs_multitask8.jsonl
  resolution: 512
  num_workers: 0
  vision_ratio: 1.0
  tasks:
    - depth
    - normal
    - segmentation
    - object_detection
    - keypoint
    - referring
    - edge
    - depth_edge

training:
  steps: 30000
  batch_size: 1
  gradient_accumulation: 4
  lr: 3.0e-5
  max_grad_norm: 1.0
  seed: 42

scheduler:
  type: "cosine"
  warmup_ratio: 0.05

flow:
  img2img_flow: true
  sigma: 0.0
  logit_normal_timesteps: true
  min_snr: true
  min_snr_gamma: 5.0
  cfg_dropout_rate: 0.1

loss:
  # pinned 2026-10-22: TrainingConfig default at the time this config was written (paper-aligned default is now all 1.0 / min_snr off)
  task_loss_weights: {depth: 2.5, normal: 2.0, semantic: 0.5}
  depth_edge_aux_weight: 0.1
  depth_edge_aux_gradient_weight: 0.25
  depth_edge_aux_edge_weight: 2.0
  depth_edge_aux_edge_threshold: 0.025
  depth_edge_aux_sigma_floor: 0.10
  normal_angular_loss_weight: 0.1

checkpoint:
  output_dir: "output/flux_8task_multitask_30k"
  save_every: 1000
  eval_every: 500
  log_every: 25

ema:
  decay: 0.9999
  warmup_steps: 500

wandb:
  enabled: true
  project: open-vision-banana
  run_name: flux-dev-8task-depth-normal-seg-det-point-refer-edge-depthedge
