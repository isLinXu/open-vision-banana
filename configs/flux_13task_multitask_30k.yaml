# FLUX.1-dev 十三任务训练配置 (Vision Banana 复现 · 全覆盖 + 合成低层视觉)
# =====================================================================
# 模型: FLUX.1-dev (12B transformer, 4-bit NF4 量化)
# 数据: SNVC-50M v5_full 十三任务 manifest (RGB 参数化)
#   高层: depth + normal + semantic seg + object detection + keypoint +
#         referring seg + edge + depth_edge + instance seg
#   低层: colorization + super_resolution + deblurring + inpainting
#   targets 由 scripts/gen_detpoint_refer_targets.py 生成
#     (坐标渲染 / Canny 派生 / GT labelmap / 连通域异色 / 确定性退化合成)
#   合并校验由 scripts/merge_multitask_manifest.py 完成 (仅保留文件存在的行)
# 覆盖: README 10 任务中除 optical flow 外全部 (flow 缺数据集 GT);
#       另加 4 个从真实照片确定性合成的低层 I2I 恢复任务
# 目标: RTX 4090 24GB 单卡 LoRA 微调, 30000 steps, 同步 W&B

model:
  name: "flux-dev"
  dtype: "bfloat16"
  quantize: "4bit"  # scripts/train.py loads FLUX unquantized without this
  resolution: 512

lora:
  rank: 32
  alpha: 64
  rs_lora: true
  target_modules:
    - "to_q"
    - "to_k"
    - "to_v"
    - "to_out.0"
    - "proj_in"
    - "proj_out"
    - "ff.net.0.proj"
    - "ff.net.2"
  dropout: 0.0

data:
  dir: /media/linxu/thinkHub/datasets/open-vision-banana-snvc-train-full
  pair_manifest: output/snvc_v5full_pairs/pairs_multitask13.jsonl
  resolution: 512
  num_workers: 0
  vision_ratio: 1.0
  tasks:
    - depth
    - normal
    - segmentation
    - object_detection
    - keypoint
    - referring
    - edge
    - depth_edge
    - instance
    - colorization
    - super_resolution
    - deblurring
    - inpainting

training:
  steps: 30000
  batch_size: 1
  gradient_accumulation: 4
  lr: 3.0e-5
  max_grad_norm: 1.0
  seed: 42

scheduler:
  type: "cosine"
  warmup_ratio: 0.05

flow:
  img2img_flow: true
  sigma: 0.0
  logit_normal_timesteps: true
  min_snr: true
  min_snr_gamma: 5.0
  cfg_dropout_rate: 0.1

loss:
  # pinned 2026-10-22: TrainingConfig default at the time this config was written (paper-aligned default is now all 1.0 / min_snr off)
  task_loss_weights: {depth: 2.5, normal: 2.0, semantic: 0.5}
  depth_edge_aux_weight: 0.1
  depth_edge_aux_gradient_weight: 0.25
  depth_edge_aux_edge_weight: 2.0
  depth_edge_aux_edge_threshold: 0.025
  depth_edge_aux_sigma_floor: 0.10
  normal_angular_loss_weight: 0.1

checkpoint:
  output_dir: "output/flux_13task_multitask_30k"
  save_every: 1000
  eval_every: 500
  log_every: 25
  # warm-start 从 8 任务 checkpoint-2000 的 LoRA 续训 (任务集 8->13, LoRA 结构不变)
  resume: "output/flux_8task_multitask_30k/checkpoint-2000/lora.pt"
  resume_weights_only: false

ema:
  decay: 0.9999
  warmup_steps: 500

wandb:
  enabled: true
  project: open-vision-banana
  run_name: flux-dev-13task-hierarchical-plus-lowlevel-restoration
