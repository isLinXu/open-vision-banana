# Optimization track. Every difference from the baseline is a project extension
# and must be promoted only after the evaluation gates in the design document.
schema_version: 1

model:
  name: "black-forest-labs/FLUX.1-schnell"
  dtype: "bfloat16"

lora:
  rank: 128
  alpha: 256
  rs_lora: true
  target_modules: null
  dropout: 0.05

optimizer:
  name: "adamw"
  lr: 2.0e-5
  weight_decay: 0.01
  betas: [0.9, 0.95]
  eps: 1.0e-8
  scheduler: "cosine"
  warmup_steps: 1000
  max_grad_norm: 1.0

data:
  root: "data/paper_reproduction"
  tasks: [depth, normal, semantic, instance, referring]
  task_dirs:
    depth: "depth"
    normal: "normal"
    semantic: "semantic"
    instance: "instance"
    referring: "referring"
  task_sampling: "uniform"
  task_weights: {}
  vision_ratio: 0.2
  generation_ratio: 0.8
  generation_path: "generation"
  colormaps: [cube_edge, viridis, plasma]
  resolution: 512
  batch_size: 1
  num_workers: 8
  augmentation: true
  val_split: 0.05

training:
  epochs: 15
  gradient_accumulation_steps: 16
  use_amp: true
  gradient_checkpointing: true
  use_ema: true
  ema_decay: 0.9999
  ema_warmup_steps: 2000
  use_logit_normal_timesteps: true
  use_min_snr: true
  min_snr_gamma: 5.0
  cfg_dropout_rate: 0.1
  use_img2img_flow: true
  flow_sigma: 0.0
  warmup_ratio: null
  save_every: 1000
  eval_every: 500
  max_keep: 5
  seed: 42
  log_every: 10
  early_stopping_patience: 7
  early_stopping_min_delta: 1.0e-4

logging:
  wandb_enabled: false
  wandb_project: "open-vision-banana-optimized"
  wandb_log_checkpoints: false
  tensorboard_enabled: true
  tensorboard_dir: "output/runs"
  run_name: "paper-optimized-multitask"

depth_mapping:
  lam: -3.0
  c: 3.3333333333333335

normal_mapping: {}

segmentation:
  color_tolerance: 14.0
  min_area_fraction: 2.0e-4
  erosion_threshold: 0.1
  bbox_expansion_factor: 5.0

output_dir: "output/paper-optimized-multitask"
