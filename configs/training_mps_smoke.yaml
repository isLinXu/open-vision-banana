# MPS smoke test config: quick check of the training pipeline
# ===========================================
# Uses a tiny dataset and checks within 50 steps:
# 1. data loading + MixedVisionDataset colormap augmentation
# 2. the LoRA training loop runs
# 3. checkpoints save correctly

model:
  name: "black-forest-labs/FLUX.1-schnell"
  dtype: "bfloat16"

lora:
  rank: 64
  alpha: 128
  rs_lora: true
  target_modules:
    - "to_k"
    - "to_v"
  dropout: 0.0

optimizer:
  lr: 5.0e-5
  weight_decay: 0.01
  scheduler: "cosine"
  warmup_steps: 10
  max_grad_norm: 1.0

output_dir: "output/checkpoints_mps_smoke"

logging:
  wandb_enabled: false
  tensorboard_enabled: true
  tensorboard_dir: "output/runs_mps_smoke"
  run_name: "mps_smoke"

training:
  epochs: 1
  gradient_accumulation_steps: 1
  use_amp: false
  use_ema: false                        # the smoke test needs no EMA
  save_every: 10
  eval_every: 999                       # disable eval
  max_keep: 2
  seed: 42
  log_every: 5
  early_stopping_patience: null
  early_stopping_min_delta: 0.0

data:
  vision_ratio: 1.0                     # vision only, no generation mixed in (simpler)
  generation_ratio: 0.0
  resolution: 256                       # smaller resolution for speed
  batch_size: 1
  num_workers: 0
  augmentation: false                   # the smoke test needs no augmentation
  val_split: 0.0

  # colormap augmentation check
  colormaps:
    - "cube_edge"
    - "plasma"

  tasks:
    depth_estimation:
      datasets:
        - name: "vb_depth_300"          # small dataset for a quick end-to-end run
          split: "train"

depth_mapping:
  lam: -3.0
  c: 3.333

normal_mapping: {}

segmentation:
  color_tolerance: 14.0
  min_area_fraction: 2.0e-4
  erosion_threshold: 0.1
  bbox_expansion_factor: 5.0
