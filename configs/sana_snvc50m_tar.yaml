# Open-Vision-Banana -- Sana_600M_512px multi-task training on SNVC-50M
#
# Reads images directly from the compressed tar.gz split volumes (no extraction).
# Requires a tar index built by scripts/build_tar_index_snvc50m_v3.py.
#
# Usage:
#   # 1) Build tar index (if not done yet)
#   python scripts/build_tar_index_snvc50m_v3.py
#
#   # 2) Build manifest from official JSONL annotations
#   python scripts/build_snvc50m_manifest.py
#
#   # 3) Launch training
#   python scripts/train_sana_512.py --config configs/sana_snvc50m_tar.yaml

model:
  name: sana-600m-512px
  model_id: Efficient-Large-Model/Sana_600M_512px_diffusers
  dtype: bfloat16
  resolution: 512

lora:
  rank: 32
  alpha: 64
  rs_lora: true
  target_modules:
    - linear
    - proj_out
    - conv_inverted
    - conv_point

data:
  # tar-direct-access mode: no data.dir needed
  pair_manifest: output/snvc50m_manifest/pairs_snvc50m.jsonl
  tar_index: output/snvc50m_manifest/tar_index_v3.json
  tar_root: data/snvc50m
  resolution: 512
  vision_ratio: 1.0
  num_workers: 4
  tasks:
    - depth
    - normal
    - semantic
  task_weights: sqrt

training:
  steps: 20000
  batch_size: 4
  gradient_accumulation: 8
  lr: 5.0e-5
  max_grad_norm: 1.0
  seed: 42
  gradient_checkpointing: true

scheduler:
  type: cosine
  warmup_ratio: 0.05
  warmup_steps: null

flow:
  img2img_flow: true
  sigma: 0.0
  logit_normal_timesteps: true
  min_snr: true
  min_snr_gamma: 5.0
  cfg_dropout_rate: 0.1

ema:
  enabled: true
  decay: 0.9999
  warmup_steps: 500

checkpoint:
  output_dir: output/sana_snvc50m_tar_3task
  save_every: 1000
  eval_every: 500
  log_every: 50

device: cuda
resume: null
