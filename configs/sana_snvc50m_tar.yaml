# Open-Vision-Banana -- Sana_600M_512px multi-task training on SNVC-50M
#
# Target-only mode: reads ONLY target images (depth/normal/seg) from compressed
# tar.gz volumes. Uses noise→target flow matching (no input RGB images needed).
#
# Prerequisites:
#   # 1) Build per-task tar indexes
#   python scripts/build_task_tar_index.py
#
#   # 2) Launch training
#   python scripts/train_sana_512.py --config configs/sana_snvc50m_tar.yaml

model:
  name: sana-600m-512px
  model_id: Efficient-Large-Model/Sana_600M_512px_diffusers
  dtype: bfloat16
  resolution: 512

lora:
  rank: 32
  alpha: 64
  rs_lora: true
  target_modules:
    - linear
    - proj_out
    - conv_inverted
    - conv_point

data:
  # Target-only mode: read targets from tar, no input RGB images
  tar_target_mode: true
  tar_index: output/snvc50m_manifest/tar_index_v3.json
  task_tar_index_dir: output/snvc50m_manifest/task_indexes
  tar_root: /media/linxu/thinkHub/datasets/SenseNova-Vision-Corpus-50M
  resolution: 512
  vision_ratio: 1.0
  num_workers: 4
  tasks:
    - depth
    - normal
    - seg
  task_weights: sqrt

training:
  steps: 20000
  batch_size: 8
  gradient_accumulation: 4
  lr: 5.0e-5
  max_grad_norm: 1.0
  seed: 42
  gradient_checkpointing: true

scheduler:
  type: cosine
  warmup_ratio: 0.05
  warmup_steps: null

flow:
  img2img_flow: false  # noise→target (no input images in tar volumes)
  sigma: 0.0
  logit_normal_timesteps: true
  min_snr: true
  min_snr_gamma: 5.0
  cfg_dropout_rate: 0.1

ema:
  enabled: true
  decay: 0.9999
  warmup_steps: 500

checkpoint:
  output_dir: output/sana_snvc50m_target_only_3task
  save_every: 1000
  eval_every: 500
  log_every: 50

device: cuda
resume: null

wandb:
  enabled: true
  project: open-vision-banana
  run_name: sana600m-snvc50m-target-3task
