# Phase 3b: high-capacity LoRA depth training
# rank=256 (vs rank=64 in Phase 2)
# more parameters = more capacity to learn the velocity field
# ================================

model:
  name: "black-forest-labs/FLUX.1-schnell"
  dtype: "bfloat16"

lora:
  rank: 256
  alpha: 512
  rs_lora: true
  target_modules:
    - "to_k"
    - "to_v"
  dropout: 0.01              # dropout against overfitting

optimizer:
  lr: 5.0e-5                 # lower LR for the higher rank
  weight_decay: 0.01
  scheduler: "cosine"
  warmup_steps: 50
  max_grad_norm: 1.0

output_dir: "output/flux_depth_hirank"

logging:
  wandb_enabled: false
  tensorboard_enabled: false
  run_name: "depth_hirank"

training:
  epochs: 1
  gradient_accumulation_steps: 1
  use_amp: true
  use_ema: false
  save_every: 200
  eval_every: 9999
  max_keep: 5
  seed: 42
  log_every: 10
  early_stopping_patience: null
  early_stopping_min_delta: 0.0

data:
  vision_ratio: 1.0
  resolution: 512
  batch_size: 1
  num_workers: 0
  augmentation: true
  val_split: 0.05

depth_mapping:
  lam: -3.0
  c: 3.333

normal_mapping: {}

segmentation:
  color_tolerance: 14.0
  min_area_fraction: 2.0e-4
  erosion_threshold: 0.1
  bbox_expansion_factor: 5.0
