# Supervised RES baseline. See docs/res_data.md for the pinned dataset release.
model:
  name: sana-1600m
  dtype: bfloat16
  resolution: 512
lora:
  rank: 32
  alpha: 64
  rs_lora: true
data:
  dir: data/res_binary_v1
  pair_manifest: data/res_binary_v1/training.jsonl
  tasks: [referring]
  num_workers: 2
  vision_ratio: 1.0
  task_sampling: proportional
training:
  steps: 10000
  batch_size: 1
  gradient_accumulation: 16
  lr: 3.0e-5
  max_grad_norm: 1.0
  seed: 42
  gradient_checkpointing: true
validation:
  max_samples_per_task: 128
scheduler:
  type: cosine
  warmup_ratio: 0.05
flow:
  img2img_flow: true
  sigma: 0.0
  shift: 3.0
  min_snr: true
  min_snr_gamma: 5.0
  cfg_dropout_rate: 0.0
loss:
  task_loss_weights: {referring: 1.0}
ema:
  enabled: true
  decay: 0.9999
  warmup_steps: 500
checkpoint:
  output_dir: output/sana_res_binary_v1
  save_every: 1000
  eval_every: 500
  log_every: 25
wandb:
  enabled: false
device: cuda
