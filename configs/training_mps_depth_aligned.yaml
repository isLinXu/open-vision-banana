# MPS depth training config: paper-alignment check
# =================================
# Tuned for Apple Silicon (MPS)
# Uses vb_depth_pseudo_5k depth data + vb_generation_5k generation data
# Goal: check that the paper's depth training pipeline converges on MPS

model:
  name: "black-forest-labs/FLUX.1-schnell"
  dtype: "bfloat16"

lora:
  rank: 64
  alpha: 128
  rs_lora: true
  target_modules:
    - "to_k"
    - "to_v"
  dropout: 0.0

optimizer:
  lr: 5.0e-5
  weight_decay: 0.01
  scheduler: "cosine"
  warmup_steps: 100
  max_grad_norm: 1.0

output_dir: "output/checkpoints_mps_depth_aligned"

logging:
  wandb_enabled: false
  tensorboard_enabled: true
  tensorboard_dir: "output/runs_mps_depth_aligned"
  run_name: "mps_depth_aligned"

training:
  epochs: 3
  gradient_accumulation_steps: 4        # equivalent batch=4
  use_amp: false                        # MPS bfloat16 has compatibility issues
  use_ema: true
  ema_decay: 0.9999
  ema_warmup_steps: 500
  save_every: 250
  eval_every: 250
  max_keep: 3
  seed: 42
  log_every: 10
  early_stopping_patience: null
  early_stopping_min_delta: 0.0

data:
  # paper "very low ratio": generation data is limited, so use 1:4 (20% vision)
  # equivalent: depth ~1230 steps/epoch + generation ~492 steps/epoch
  vision_ratio: 0.2
  generation_ratio: 0.8
  resolution: 512
  batch_size: 1                         # conservative on MPS
  num_workers: 0                         # must be 0 on MPS
  augmentation: true
  val_split: 0.05
  generation_path: "data/vb_generation_5k"

  # colormap augmentation: the paper uses plasma/inferno/viridis/grayscale
  colormaps:
    - "cube_edge"
    - "plasma"
    - "inferno"
    - "viridis"
    - "grayscale"

  tasks:
    depth_estimation:
      datasets:
        - name: "vb_depth_pseudo_5k"
          split: "train"

depth_mapping:
  lam: -3.0
  c: 3.333

normal_mapping: {}

segmentation:
  color_tolerance: 14.0
  min_area_fraction: 2.0e-4
  erosion_threshold: 0.1
  bbox_expansion_factor: 5.0
