# MPS 深度训练配置 — 论文对齐验证
# =================================
# 针对 Apple Silicon (MPS) 优化
# 使用 vb_depth_pseudo_5k 深度数据 + vb_generation_5k 生成数据
# 目标: 验证论文 depth 训练 pipeline 在 MPS 上可收敛

model:
  name: "/Users/gatilin/MyWork/models/ckpts/FLUX.1-schnell"
  dtype: "bfloat16"

lora:
  rank: 64
  alpha: 128
  rs_lora: true
  target_modules:
    - "to_k"
    - "to_v"
  dropout: 0.0

optimizer:
  lr: 5.0e-5
  weight_decay: 0.01
  scheduler: "cosine"
  warmup_steps: 100
  max_grad_norm: 1.0

output_dir: "output/checkpoints_mps_depth_aligned"

logging:
  wandb_enabled: false
  tensorboard_enabled: true
  tensorboard_dir: "output/runs_mps_depth_aligned"
  run_name: "mps_depth_aligned"

training:
  epochs: 3
  gradient_accumulation_steps: 4        # 等效 batch=4
  use_amp: false                        # MPS bfloat16 有兼容性问题
  use_ema: true
  ema_decay: 0.9999
  ema_warmup_steps: 500
  save_every: 250
  eval_every: 250
  max_keep: 3
  seed: 42
  log_every: 10
  early_stopping_patience: null
  early_stopping_min_delta: 0.0

data:
  # 论文 "very low ratio" — 因生成数据有限，使用 1:4 (20% 视觉)
  # 等效: 深度 ~1230 steps/epoch + 生成 ~492 steps/epoch
  vision_ratio: 0.2
  generation_ratio: 0.8
  resolution: 512
  batch_size: 1                         # MPS 保守设置
  num_workers: 0                        # MPS 必须 0
  augmentation: true
  val_split: 0.05
  generation_path: "data/vb_generation_5k"

  # 色图增强: 论文要求 plasma/inferno/viridis/grayscale
  colormaps:
    - "cube_edge"
    - "plasma"
    - "inferno"
    - "viridis"
    - "grayscale"

  tasks:
    depth_estimation:
      datasets:
        - name: "vb_depth_pseudo_5k"
          split: "train"

depth_mapping:
  lam: -3.0
  c: 3.333

normal_mapping: {}

segmentation:
  color_tolerance: 14.0
  min_area_fraction: 2.0e-4
  erosion_threshold: 0.1
  bbox_expansion_factor: 5.0
