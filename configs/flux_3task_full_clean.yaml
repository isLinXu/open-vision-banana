# FLUX.1-dev three-task training config (Vision Banana reproduction)
# ================================================
# Model: FLUX.1-dev (12B transformer, 4-bit NF4 quantization, T5 8-bit)
# Data: three-task subset of SenseNova-Vision-Corpus-50M (depth + normal + seg)
# Target: single RTX 4090 24GB LoRA fine-tuning

model:
  name: "flux-dev"
  dtype: "bfloat16"
  quantize: "4bit"  # scripts/train.py loads FLUX unquantized without this
  resolution: 512

lora:
  rank: 32
  alpha: 64
  rs_lora: true
  target_modules:
    - "to_q"
    - "to_k"
    - "to_v"
    - "to_out.0"
    - "proj_in"
    - "proj_out"
    - "ff.net.0.proj"
    - "ff.net.2"
  dropout: 0.0

data:
  dir: data/raw/open-vision-banana-snvc-train-full
  pair_manifest: output/snvc_v5full_pairs/pairs_3task_clean.jsonl
  resolution: 512
  num_workers: 0
  vision_ratio: 1.0
  tasks:
    - depth
    - normal
    - segmentation

training:
  steps: 5000
  batch_size: 1
  gradient_accumulation: 4
  lr: 3.0e-5
  max_grad_norm: 1.0
  seed: 42

scheduler:
  type: "cosine"
  warmup_ratio: 0.05

flow:
  img2img_flow: true
  sigma: 0.0
  logit_normal_timesteps: true
  min_snr: true
  min_snr_gamma: 5.0
  cfg_dropout_rate: 0.1

loss:
  # pinned 2026-10-22: TrainingConfig default at the time this config was written (paper-aligned default is now all 1.0 / min_snr off)
  task_loss_weights: {depth: 2.5, normal: 2.0, semantic: 0.5}
  depth_edge_aux_weight: 0.1
  depth_edge_aux_gradient_weight: 0.25
  depth_edge_aux_edge_weight: 2.0
  depth_edge_aux_edge_threshold: 0.025
  depth_edge_aux_sigma_floor: 0.10
  normal_angular_loss_weight: 0.1

checkpoint:
  output_dir: "output/flux_3task_full_clean"
  save_every: 500
  eval_every: 250
  log_every: 25

ema:
  decay: 0.9999
  warmup_steps: 500

wandb:
  enabled: true
  project: open-vision-banana
  run_name: flux-dev-3task-depth-normal-seg
