# FLUX.1-dev 三任务训练配置 (Vision Banana 复现)
# ================================================
# 模型: FLUX.1-dev (12B transformer, 8-bit 量化加载)
# 数据: SenseNova-Vision-Corpus-50M 三任务子集 (depth + normal + seg)
# 目标: RTX 4090 24GB 单卡 LoRA 微调

model:
  name: "flux-dev"
  dtype: "bfloat16"
  resolution: 512

lora:
  rank: 32
  alpha: 64
  rs_lora: true
  target_modules:
    - "to_q"
    - "to_k"
    - "to_v"
    - "to_out.0"
    - "proj_in"
    - "proj_out"
    - "ff.net.0.proj"
    - "ff.net.2"
  dropout: 0.0

data:
  dir: /media/linxu/thinkHub/datasets/open-vision-banana-snvc-train-full
  pair_manifest: output/snvc_v5full_pairs/pairs_3task_clean.jsonl
  resolution: 512
  num_workers: 0
  vision_ratio: 1.0
  tasks:
    - depth
    - normal
    - segmentation

training:
  steps: 5000
  batch_size: 1
  gradient_accumulation: 4
  lr: 3.0e-5
  max_grad_norm: 1.0
  seed: 42

scheduler:
  type: "cosine"
  warmup_ratio: 0.05

flow:
  img2img_flow: true
  sigma: 0.0
  logit_normal_timesteps: true
  min_snr: true
  min_snr_gamma: 5.0
  cfg_dropout_rate: 0.1

loss:
  depth_edge_aux_weight: 0.1
  depth_edge_aux_gradient_weight: 0.25
  depth_edge_aux_edge_weight: 2.0
  depth_edge_aux_edge_threshold: 0.025
  depth_edge_aux_sigma_floor: 0.10
  normal_angular_loss_weight: 0.1

checkpoint:
  output_dir: "output/flux_3task_full_clean"
  save_every: 500
  eval_every: 250
  log_every: 25

ema:
  decay: 0.9999
  warmup_steps: 500

wandb:
  enabled: true
  project: open-vision-banana
  run_name: flux-dev-3task-depth-normal-seg
