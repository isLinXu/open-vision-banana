# OVB #143 multi-backbone: MOSS-Image-Base (42 single-stream layers, in-context [source | target] panel).
# Generated from fusion_r64_large_scale.yaml; only model.name, lora.target_modules and
# checkpoint.output_dir differ. Targets mirror the main recipe: attention q/k/v/o and the MLP of every
# main layer; the text-refinement blocks and the embedders are left untouched.
model:
  name: moss-image
  dtype: bfloat16
  resolution: 512
lora:
  rank: 64
  alpha: 64
  rs_lora: true
  target_modules:
  - proj.q
  - proj.k
  - proj.v
  - proj.o
  - proj.ffn_up_gate
  - proj.ffn_down
data:
  tasks:
  - depth
  - semantic
  - instance
  - referring
  - generation
  referring_prompt_version: query_v2
  task_sampling: uniform
  task_sampling_weights:
    depth: 0.35
    semantic: 0.20
    instance: 0.20
    referring: 0.20
    generation: 0.05
  vision_ratio: 0.9
  depth_curve: metric_power
  depth_colormaps:
  - cube_edge
  semantic_prompt_styles:
  - json_named
  - json_tuple
  - natural
  - hex
  semantic_color_remap_prob: 0.5
  aspect_preserving_crop: true
  num_workers: 4
  dir: data/fusion_r64_full_referring
  # Strict composition output: full RES + all admitted LLMSeg COCO questions (no EgoObjects).
  # Replace legacy referring subsets; see configs/datasets/fusion_r64_pool_spec.example.json.
  pair_manifest: data/fusion_r64_full_referring/training.jsonl
  max_samples_per_task: null
training:
  tune_mode: lora
  objective: sft
  steps: 100000
  # Deployment placeholders: bind to the actual training environment.
  # Require world_size * batch_size * gradient_accumulation == 32.
  # These values do not assert an 8-process or evaluation-server deployment.
  batch_size: 1
  gradient_accumulation: 4
  lr: 3.0e-05
  max_grad_norm: 1.0
  drop_grad_norm: 10.0
  seed: 42
  gradient_checkpointing: true
optimizer:
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.999
  eps: 1.0e-08
scheduler:
  type: cosine
  warmup_steps: 2000
validation:
  max_samples_per_task: 40
flow:
  img2img_flow: true
  sigma: 0.0
  logit_normal_timesteps: true
  shift: 1.0
  min_snr: false
  cfg_dropout_rate: 0.05
loss:
  task_loss_weights:
    depth: 1.0
    semantic: 1.0
    instance: 1.0
    referring: 1.0
  normal_angular_loss_weight: 0.0
  depth_edge_aux_weight: 0.0
ema:
  enabled: true
  decay: 0.9999
  warmup_steps: 500
checkpoint:
  output_dir: output/mb_moss_image_s42
  save_every: 5000
  eval_every: 2500
  log_every: 50
  resume_weights_only: false
wandb:
  enabled: false
  project: open-vision-banana
device: cuda
