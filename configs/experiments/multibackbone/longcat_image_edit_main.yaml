# OVB #143 multi-backbone: LongCat-Image-Edit (10 double + 20 single blocks).
# Generated from fusion_r64_large_scale.yaml; only model.name, lora.target_modules and
# checkpoint.output_dir differ. Targets mirror the main recipe (image-stream attention q/k/v/out and
# the image MLP of the double-stream blocks; attention, MLP and output projections of the single-stream
# blocks); text-stream projections, embedders and the final proj_out are left untouched.
model:
  name: longcat-image-edit
  dtype: bfloat16
  resolution: 512
lora:
  rank: 64
  alpha: 64
  rs_lora: true
  target_modules:
  - attn.to_q
  - attn.to_k
  - attn.to_v
  - attn.to_out.0
  - ff.net.0.proj
  - ff.net.2
  - proj_mlp
  - single_transformer_blocks.0.proj_out
  - single_transformer_blocks.1.proj_out
  - single_transformer_blocks.2.proj_out
  - single_transformer_blocks.3.proj_out
  - single_transformer_blocks.4.proj_out
  - single_transformer_blocks.5.proj_out
  - single_transformer_blocks.6.proj_out
  - single_transformer_blocks.7.proj_out
  - single_transformer_blocks.8.proj_out
  - single_transformer_blocks.9.proj_out
  - single_transformer_blocks.10.proj_out
  - single_transformer_blocks.11.proj_out
  - single_transformer_blocks.12.proj_out
  - single_transformer_blocks.13.proj_out
  - single_transformer_blocks.14.proj_out
  - single_transformer_blocks.15.proj_out
  - single_transformer_blocks.16.proj_out
  - single_transformer_blocks.17.proj_out
  - single_transformer_blocks.18.proj_out
  - single_transformer_blocks.19.proj_out
data:
  tasks:
  - depth
  - semantic
  - instance
  - referring
  - generation
  referring_prompt_version: query_v2
  task_sampling: uniform
  task_sampling_weights:
    depth: 0.35
    semantic: 0.20
    instance: 0.20
    referring: 0.20
    generation: 0.05
  vision_ratio: 0.9
  depth_curve: metric_power
  depth_colormaps:
  - cube_edge
  semantic_prompt_styles:
  - json_named
  - json_tuple
  - natural
  - hex
  semantic_color_remap_prob: 0.5
  aspect_preserving_crop: true
  num_workers: 4
  dir: data/fusion_r64_full_referring
  # Strict composition output: full RES + all admitted LLMSeg COCO questions (no EgoObjects).
  # Replace legacy referring subsets; see configs/datasets/fusion_r64_pool_spec.example.json.
  pair_manifest: data/fusion_r64_full_referring/training.jsonl
  max_samples_per_task: null
training:
  tune_mode: lora
  objective: sft
  steps: 100000
  # Deployment placeholders: bind to the actual training environment.
  # Require world_size * batch_size * gradient_accumulation == 32.
  # These values do not assert an 8-process or evaluation-server deployment.
  batch_size: 1
  gradient_accumulation: 4
  lr: 3.0e-05
  max_grad_norm: 1.0
  drop_grad_norm: 10.0
  seed: 42
  gradient_checkpointing: true
optimizer:
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.999
  eps: 1.0e-08
scheduler:
  type: cosine
  warmup_steps: 2000
validation:
  max_samples_per_task: 40
flow:
  img2img_flow: true
  sigma: 0.0
  logit_normal_timesteps: true
  shift: 1.0
  min_snr: false
  cfg_dropout_rate: 0.05
loss:
  task_loss_weights:
    depth: 1.0
    semantic: 1.0
    instance: 1.0
    referring: 1.0
  normal_angular_loss_weight: 0.0
  depth_edge_aux_weight: 0.0
ema:
  enabled: true
  decay: 0.9999
  warmup_steps: 500
checkpoint:
  output_dir: output/mb_longcat_image_edit_s42
  save_every: 5000
  eval_every: 2500
  log_every: 50
  resume_weights_only: false
wandb:
  enabled: false
  project: open-vision-banana
device: cuda
