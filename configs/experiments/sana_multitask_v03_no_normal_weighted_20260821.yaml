experiment: sana_multitask_v03_no_normal_weighted_20260821

model:
  name: sana-600m-512px
  model_id: Efficient-Large-Model/Sana_600M_512px_diffusers
  dtype: float16
  resolution: 512

lora:
  rank: 32
  alpha: 64
  rs_lora: true
  target_modules: [linear, proj_out, conv_inverted, conv_point]

data:
  dir: /Users/gatilin/PycharmProjects/open-vision-banana/data/vb_snvc_train_v5_full
  pair_manifest: output/mar_vb_clean_pairs_v4/pairs.jsonl
  resolution: 512
  vision_ratio: 1.0
  num_workers: 0
  tasks: [depth, semantic, structure]
  task_weights: uniform

training:
  steps: 4000
  batch_size: 1
  gradient_accumulation: 8
  lr: 1.0e-5
  max_grad_norm: 1.0
  seed: 42
  gradient_checkpointing: true

loss:
  task_loss_weights: depth=2.0,semantic=3.0,structure=0.5

scheduler:
  type: cosine
  warmup_ratio: 0.05

flow:
  img2img_flow: true
  sigma: 0.0
  logit_normal_timesteps: true
  min_snr: true
  min_snr_gamma: 5.0
  cfg_dropout_rate: 0.1

ema:
  enabled: true
  decay: 0.9999
  warmup_steps: 250

checkpoint:
  output_dir: output/sana_multitask_v03_no_normal_weighted_20260821
  save_every: 100
  eval_every: 500
  log_every: 50

evaluation:
  evaluator: scripts/eval_sana_unified.py
  split: val
  n_per_task: 8
  batch_size: 1
  num_inference_steps: 20
  guidance_scale: 1.0
  seed: 42

device: mps
