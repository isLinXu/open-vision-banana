# E1: gate replication experiment (rank=64 / 512px / 8-sample overfit)
#
# Purpose: on the reusable training path (scripts/mps_train_sdxl_depth.py, driven by env vars),
# replicate the key settings of the successful standalone gate 1:1, to test the single-variable
# hypothesis that the negative capacity-ladder result came from too low a rank or resolution.
#
# Background evidence (archived internal analysis doc):
#   - capacity_8x200 (rank 8, 128px): train r = -0.087, failed to overfit
#   - standalone gate (rank 64, 4-step schedule): single-sample r = 0.8154
#
# Success criteria:
#   - train split Pearson r >= 0.8 (8-sample overfit)
#   - raw RGB MAE <= 0.14 (matches the gate)
#   - raw prediction curve MAE drops from 0.16 to < 0.05
#
# Expected time: about 6-8 hours on MPS (512px, ~74 s/step x 300 steps; run overnight)

experiment: e1_gate_replica
date: 2026-07-27
seed: 42

# NOTE: This script has been archived. See scripts/archive/pre_opensource/
script: scripts/archive/pre_opensource/mps_train_sdxl_depth.py

env:
  VB_MODEL: segmind/SSD-1B
  VB_DATA: data/vb_snvc_train_v3/depth
  VB_STEPS: 300
  VB_NSAMPLES: 8          # overfit gate: only 8 training samples
  VB_RES: 512             # matches the successful gate's resolution (the 128px of the capacity runs is the main suspect)
  VB_BATCH: 1             # memory-safe value for 512px fp32 on MPS
  VB_LR: 1.0e-4
  VB_RANK: 64             # matches the successful gate (rank 8 of the capacity runs is the main suspect)
  VB_ALPHA: 128
  VB_WARMUP: 20
  VB_SAVE_EVERY: 100
  VB_HOLDOUT: ""          # the overfit gate keeps no holdout
  VB_OUT: output/e1_gate_replica_rank64_512_8x300

# One-line command (run from the project root):
#   VB_STEPS=300 VB_NSAMPLES=8 VB_RES=512 VB_BATCH=1 VB_RANK=64 VB_ALPHA=128 \
#   VB_WARMUP=20 VB_SAVE_EVERY=100 VB_HOLDOUT= \
#   VB_OUT=output/e1_gate_replica_rank64_512_8x300 \
#   PYTHONPATH=src python scripts/mps_train_sdxl_depth.py

evaluation:
  script: scripts/archive/pre_opensource/evaluate_v3_relative_depth.py
  note: after training, evaluate ckpt_final on the same 8 train samples against the success criteria

followups:
  - E2: rank sweep {16, 32, 64} @ 256px (if E1 passes, find the smallest usable rank)
  - E3: resolution sweep {128, 256, 512} @ rank 64 (quantify the marginal gain of resolution)
  - Generalization check: E1 config x the full 2162 train set, evaluated on the 135-image official val split
