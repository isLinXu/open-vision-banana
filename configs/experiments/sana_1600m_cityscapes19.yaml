# Official 19-class Cityscapes specialist. Do not mix ADE-150 / SNVC seg targets.
# Training and evaluation share CITYSCAPES_RGB_LEGEND and SEMANTIC_SEGMENTATION_PROMPT.
experiment: sana_1600m_cityscapes19

model:
  name: sana-1600m
  dtype: bfloat16
  resolution: 512

lora:
  rank: 32
  alpha: 64
  rs_lora: true
  target_modules:
    - linear
    - proj_out
    - conv_inverted
    - conv_point

data:
  dir: data/cityscapes19
  pair_manifest: data/cityscapes19/pairs.jsonl
  resolution: 512
  vision_ratio: 1.0
  num_workers: 2
  tasks:
    - semantic

training:
  steps: 3000
  batch_size: 1
  gradient_accumulation: 8
  lr: 5.0e-5
  max_grad_norm: 1.0
  seed: 42
  gradient_checkpointing: true

scheduler:
  type: cosine
  warmup_ratio: 0.05

flow:
  img2img_flow: true
  sigma: 0.0
  logit_normal_timesteps: true
  shift: 1.0
  min_snr: true
  min_snr_gamma: 5.0
  cfg_dropout_rate: 0.1

ema:
  enabled: true
  decay: 0.9999
  warmup_steps: 100

checkpoint:
  output_dir: output/sana_1600m_cityscapes19
  save_every: 500
  eval_every: 500
  log_every: 25

wandb:
  enabled: false

device: cuda
