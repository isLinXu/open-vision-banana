# FLUX.1-schnell shared-LoRA paper-method gate continuation.
# Resume checkpoint-170 (interrupted after max_steps failed to stop at 100).
# Inference now uses training-matched Euler flow. Do not claim Table 1.
experiment: flux_schnell_paper_gate_resume300_20260825

model:
  name: flux-schnell
  local_path: data/
  dtype: bfloat16
  resolution: 512
  num_inference_steps: 4
  guidance_scale: 0.0

lora:
  rank: 64
  alpha: 128
  rs_lora: true

data:
  dir: data/flux_paper_gate_512
  vision_ratio: 0.1

training:
  resume_from: output/flux_schnell_paper_gate_lr1e5_20260824/checkpoint-170
  steps: 300
  batch_size: 1
  gradient_accumulation: 4
  lr: 1.0e-5
  seed: 42
  ema: false

flow:
  img2img_flow: true

