# Boundary-focused, capped refinement from the established depth specialist.
# The training manifest retains all 5,813 depth train rows and duplicates only
# the decoded-depth edge-density top quartile.  Validation remains the original
# 301-row split and checkpoint promotion is based on the external depth metric
# gate, not this trainer's diffusion val_loss.
experiment: sana_depth_edge_reweight_short_lr1e6_20260817
resume_checkpoint: output/sana_depth_gate_full_refine_lr1e5_20260814/checkpoint-3000_best/lora.pt

model:
  name: sana-600m-512px
  dtype: float16
  resolution: 512

lora:
  rank: 16
  alpha: 32
  rs_lora: true

data:
  dir: data/vb_snvc_train_v5_full
  pair_manifest: output/sana_depth_edge_reweight_short_lr1e6_20260817/pairs_depth_edge_q75_x2.jsonl
  resolution: 512
  vision_ratio: 1.0
  num_workers: 0
  tasks:
    - depth
  task_weights: uniform
  reweighting:
    source_manifest: output/mar_vb_clean_pairs_v4/pairs.jsonl
    strategy: decoded_depth_edge_density_top_quartile_x2
    edge_fraction: 0.25
    high_edge_repeat: 2
    edge_resolution: 128
    edge_threshold: 0.025

training:
  # The prior full refinement peaked near 1,000 updates and then regressed.
  # This run deliberately caps optimisation at that boundary.
  steps: 1000
  batch_size: 1
  gradient_accumulation: 1
  lr: 1.0e-6
  max_grad_norm: 1.0
  seed: 42

scheduler:
  type: constant
  warmup_steps: 50

flow:
  img2img_flow: true
  sigma: 0.0
  logit_normal_timesteps: true
  min_snr: false
  cfg_dropout_rate: 0.0

ema:
  decay: 0.9999
  warmup_steps: 250

checkpoint:
  output_dir: output/sana_depth_edge_reweight_short_lr1e6_20260817
  save_every: 250
  eval_every: 250
  log_every: 10

metric_gate:
  split: val
  n_samples: 32
  chunk_size: 4
  resolution: 512
  num_inference_steps: 20
  guidance_scale: 1.0
  seed: 42
  select: max(relative_position_spearman_r), max(relative_position_pearson_r), min(rgb_mae)
  val32_promote:
    relative_position_spearman_r_min: 0.79
    relative_position_pearson_r_min: 0.79
    rgb_mae_max: 0.195
  val128_accept:
    relative_position_spearman_r_min: 0.778
    relative_position_pearson_r_min: 0.791
    rgb_mae_max: 0.198

device: mps
