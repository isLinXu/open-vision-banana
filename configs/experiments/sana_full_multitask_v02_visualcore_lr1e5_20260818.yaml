# Visual-core continuation for full v5 multi-task coverage.
# The previous v01 run used vision_ratio=0.1 and under-exposed the visual
# manifest. This stage deliberately uses every batch for the four visual
# tasks, while retaining the validated checkpoint-1000-best LoRA weights.
experiment: sana_full_multitask_v02_visualcore_lr1e5_20260818
resume_checkpoint: output/sana_full_multitask_v01_lr5e5_20260817/checkpoint-1000_best/lora.pt
resume_weights_only: true

model:
  name: sana-600m-512px
  model_id: Efficient-Large-Model/Sana_600M_512px_diffusers
  dtype: float16
  resolution: 512

lora:
  rank: 32
  alpha: 64
  rs_lora: true
  target_modules:
    - linear
    - proj_out
    - conv_inverted
    - conv_point

data:
  dir: /Users/gatilin/PycharmProjects/open-vision-banana/data/vb_snvc_train_v5_full
  pair_manifest: output/mar_vb_clean_pairs_v4/pairs.jsonl
  resolution: 512
  vision_ratio: 1.0
  num_workers: 0
  tasks:
    - depth
    - normal
    - semantic
    - structure
  task_weights: uniform

training:
  # Four thousand optimizer steps expose roughly 32k visual samples with
  # grad accumulation 8, enough for repeated coverage of each task pool.
  steps: 4000
  batch_size: 1
  gradient_accumulation: 8
  lr: 1.0e-5
  max_grad_norm: 1.0
  seed: 42
  gradient_checkpointing: true

scheduler:
  type: cosine
  warmup_ratio: 0.05
  warmup_steps: null

flow:
  img2img_flow: true
  sigma: 0.0
  logit_normal_timesteps: true
  min_snr: true
  min_snr_gamma: 5.0
  cfg_dropout_rate: 0.1

ema:
  enabled: true
  decay: 0.9999
  warmup_steps: 250

checkpoint:
  output_dir: output/sana_full_multitask_v02_visualcore_lr1e5_20260818
  save_every: 500
  eval_every: 1000
  log_every: 50

evaluation:
  evaluator: scripts/eval_sana_unified.py
  split: val
  n_per_task: 8
  batch_size: 1
  num_inference_steps: 20
  guidance_scale: 1.0
  seed: 42
  selection: task metrics on fixed val n=8/task; do not select by aggregate val_loss

device: mps
