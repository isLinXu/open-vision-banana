# First metric-gated continuation from the best edge-weighted checkpoint.
# The preceding q75 x2 experiment improved RGB fidelity but peaked on the
# external structure metric at 250 updates.  This stage weakens the sampling
# bias, halves the learning rate, and exposes a single 50-step candidate.
experiment: sana_depth_edge_reweight_metric_v01_lr5e7_stage50_20260817
resume_checkpoint: output/sana_depth_edge_reweight_short_lr1e6_20260817/checkpoint-250/lora.pt

parent_metric:
  checkpoint: output/sana_depth_edge_reweight_short_lr1e6_20260817/checkpoint-250/lora_adapter
  relative_position_spearman_r: 0.7886882820166647
  relative_position_pearson_r: 0.7930655349045992
  rgb_mae: 0.18705577473156154

model:
  name: sana-600m-512px
  dtype: float16
  resolution: 512

lora:
  rank: 16
  alpha: 32
  rs_lora: true

data:
  dir: /Users/gatilin/PycharmProjects/open-vision-banana/data/vb_snvc_train_v5_full
  pair_manifest: output/sana_depth_edge_reweight_metric_v01_lr5e7_20260817/pairs_depth_edge_q85_x2.jsonl
  resolution: 512
  vision_ratio: 1.0
  num_workers: 0
  tasks:
    - depth
  task_weights: uniform
  reweighting:
    source_manifest: output/mar_vb_clean_pairs_v4/pairs.jsonl
    strategy: decoded_depth_edge_density_top_15_percent_x2
    edge_fraction: 0.15
    high_edge_repeat: 2
    edge_resolution: 128
    edge_threshold: 0.025

training:
  steps: 50
  batch_size: 1
  gradient_accumulation: 1
  lr: 5.0e-7
  max_grad_norm: 1.0
  seed: 42

scheduler:
  type: constant
  warmup_steps: 5

flow:
  img2img_flow: true
  sigma: 0.0
  logit_normal_timesteps: true
  min_snr: false
  cfg_dropout_rate: 0.0

ema:
  decay: 0.9999
  warmup_steps: 25

checkpoint:
  output_dir: output/sana_depth_edge_reweight_metric_v01_lr5e7_stage50_20260817
  save_every: 50
  eval_every: 50
  log_every: 10

metric_gate:
  split: val
  n_samples: 32
  chunk_size: 4
  resolution: 512
  num_inference_steps: 20
  guidance_scale: 1.0
  seed: 42
  select: max(relative_position_spearman_r), max(relative_position_pearson_r), min(rgb_mae)
  continue_only_if:
    relative_position_spearman_r_min: 0.7886882820166647
    relative_position_pearson_r_min: 0.7930655349045992
    rgb_mae_max: 0.18705577473156154
  max_cumulative_steps: 200

device: mps
