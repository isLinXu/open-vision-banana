# Continuation of the v02 100-step gate.  The stage-100 checkpoint passed the
# fixed depth gate and improved the fixed generation-preservation proxy, so
# this extends the exact run to 250 optimizer updates without changing data,
# LoRA, learning rate, or flow objective.
experiment: sana_depth_gate_mixed_v02_lr1e6_stage250_20260816
resume_checkpoint: output/sana_depth_gate_mixed_v02_lr1e6_stage100_20260816/checkpoint-100_final/lora.pt
stage_100_validation_32:
  relative_position_spearman_r: 0.7844779156148434
  relative_position_pearson_r: 0.7894520196132362
  rgb_mae: 0.1909918508026749
stage_100_generation_proxy_32:
  fid_proxy: 29.66759475528329
  diversity_score: 0.4886128902435303
  generation_health_score: 62.79890060424805
acceptance_at_32:
  relative_position_spearman_r_min: 0.758
  relative_position_pearson_r_min: 0.775
  rgb_mae_max: 0.214

model:
  name: sana-600m-512px
  dtype: float16
  resolution: 512

lora:
  rank: 16
  alpha: 32
  rs_lora: true

data:
  dir: data/vb_snvc_train_v5_full
  pair_manifest: output/mar_vb_clean_pairs_v4/pairs.jsonl
  generation_dir: data/vb_generation_5k
  resolution: 512
  vision_ratio: 0.1
  num_workers: 0
  tasks:
    - depth
  task_weights: sqrt

training:
  steps: 250
  batch_size: 1
  gradient_accumulation: 1
  lr: 1.0e-6
  max_grad_norm: 1.0
  seed: 42

scheduler:
  type: constant
  warmup_steps: 20

flow:
  img2img_flow: true
  sigma: 0.0
  logit_normal_timesteps: true
  min_snr: false
  cfg_dropout_rate: 0.0

ema:
  decay: 0.9999
  warmup_steps: 100

checkpoint:
  output_dir: output/sana_depth_gate_mixed_v02_lr1e6_stage250_20260816
  save_every: 50
  eval_every: 1000
  log_every: 10

device: mps
