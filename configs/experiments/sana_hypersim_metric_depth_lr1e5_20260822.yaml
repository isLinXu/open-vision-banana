# Metric Hypersim depth specialist. Starts from the relative-depth LoRA
# (checkpoint-3000_best, Pearson 0.790) and continues on Eq.1-encoded
# metric metres. Do not mix relative-depth COCO pseudo targets.
# Selected checkpoint: step 500.
# NYU Eigen+10m full val n=654: δ1=0.403 / AbsRel=0.367 / RMSE=1.090.
# n=32 probe was δ1=0.357. Step 1000 is worse (δ1=0.227). Do not resume 1500/2000.
experiment: sana_hypersim_metric_depth_lr1e5_20260822
baseline_checkpoint: output/sana_depth_gate_full_refine_lr1e5_20260814/checkpoint-3000_best/lora.pt

model:
  name: sana-600m-512px
  model_id: Efficient-Large-Model/Sana_600M_512px_diffusers
  dtype: float16
  resolution: 512

lora:
  rank: 16
  alpha: 32
  rs_lora: true

data:
  dir: data/hypersim_depth_512
  pair_manifest: data/hypersim_depth_512/pairs.jsonl
  resolution: 512
  vision_ratio: 1.0
  num_workers: 0
  tasks: [depth]
  task_weights: uniform

training:
  steps: 2000
  batch_size: 1
  gradient_accumulation: 8
  lr: 1.0e-5
  max_grad_norm: 1.0
  seed: 42
  gradient_checkpointing: true

scheduler:
  type: cosine
  warmup_ratio: 0.05

flow:
  img2img_flow: true
  sigma: 0.0
  logit_normal_timesteps: true
  min_snr: true
  min_snr_gamma: 5.0
  cfg_dropout_rate: 0.1

ema:
  enabled: true
  decay: 0.9999
  warmup_steps: 100

checkpoint:
  output_dir: output/sana_hypersim_metric_depth_lr1e5_20260822
  save_every: 100
  eval_every: 500
  log_every: 50

device: mps
