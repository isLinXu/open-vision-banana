# Continue the official 19-class Cityscapes specialist after the 3000-step run.
# Cosine on the first run had already decayed to 5e-7; this run reloads LoRA
# weights only and uses a fresh 15000-step cosine. Train split only (2975).
# Do not mix ADE-150 / SNVC seg targets.
experiment: sana_1600m_cityscapes19_15k

model:
  name: sana-1600m
  dtype: bfloat16
  resolution: 512

lora:
  rank: 32
  alpha: 64
  rs_lora: true
  target_modules:
    - linear
    - proj_out
    - conv_inverted
    - conv_point

data:
  dir: data/cityscapes19
  pair_manifest: data/cityscapes19/pairs.jsonl
  resolution: 512
  vision_ratio: 1.0
  num_workers: 2
  tasks:
    - semantic

training:
  steps: 15000
  batch_size: 1
  gradient_accumulation: 8
  lr: 5.0e-5
  max_grad_norm: 1.0
  seed: 42
  gradient_checkpointing: true

scheduler:
  type: cosine
  warmup_ratio: 0.03

flow:
  img2img_flow: true
  sigma: 0.0
  logit_normal_timesteps: true
  shift: 1.0
  min_snr: true
  min_snr_gamma: 5.0
  cfg_dropout_rate: 0.1

ema:
  enabled: true
  decay: 0.9999
  warmup_steps: 100

checkpoint:
  output_dir: output/sana_1600m_cityscapes19_15k
  save_every: 1000
  eval_every: 1000
  log_every: 25

wandb:
  enabled: false

device: cuda

loss:
  # pinned 2026-10-22: TrainingConfig default at the time this config was written (paper-aligned default is now all 1.0 / min_snr off)
  task_loss_weights: {depth: 2.5, normal: 2.0, semantic: 0.5}
