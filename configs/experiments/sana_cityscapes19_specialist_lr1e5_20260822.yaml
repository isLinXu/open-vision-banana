# 19-class Cityscapes specialist after v03 multitask failed the step-500 gate.
# Shared LoRA cannot keep semantic mIoU above ~0; this run uses the official
# 19-color palette only. Do not mix ADE/COCO 117-class targets.
experiment: sana_cityscapes19_specialist_lr1e5_20260822

model:
  name: sana-600m-512px
  model_id: Efficient-Large-Model/Sana_600M_512px_diffusers
  dtype: float16
  resolution: 512

lora:
  rank: 16
  alpha: 32
  rs_lora: true

data:
  dir: data/cityscapes_19class_512
  pair_manifest: data/cityscapes_19class_512/pairs.jsonl
  resolution: 512
  vision_ratio: 1.0
  num_workers: 0
  tasks: [semantic]
  task_weights: uniform

training:
  steps: 2000
  batch_size: 1
  gradient_accumulation: 8
  lr: 1.0e-5
  max_grad_norm: 1.0
  seed: 42
  gradient_checkpointing: true

scheduler:
  type: cosine
  warmup_ratio: 0.05

flow:
  img2img_flow: true
  sigma: 0.0
  logit_normal_timesteps: true
  min_snr: true
  min_snr_gamma: 5.0
  cfg_dropout_rate: 0.1

ema:
  enabled: true
  decay: 0.9999
  warmup_steps: 100

checkpoint:
  output_dir: output/sana_cityscapes19_specialist_lr1e5_20260822
  save_every: 100
  eval_every: 500
  log_every: 50

device: mps
