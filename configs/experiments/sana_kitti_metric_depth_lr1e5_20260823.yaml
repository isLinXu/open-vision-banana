# Outdoor metric-depth specialist. Starts from the Hypersim indoor
# checkpoint-500 (NYU n=654 δ1=0.403) and continues on KITTI train
# annotated metres. Val drives are excluded from the prepared split.
# Selected checkpoint for outdoor-only: step 300 (lowest train loss).
# ETH3D n=83 80m-cap: step 300 δ1=0.169 / AbsRel=0.593; step 400 δ1=0.167 / 0.604.
# NYU n=32: step 300 δ1=0.106, step 400 δ1=0.092. Keep indoor ckpt-500 for NYU.
# Mixed replay continues from step 300, not a longer pure-KITTI run.
# Do not mix relative-depth COCO targets. Do not resume the indoor 1000-run.
experiment: sana_kitti_metric_depth_lr1e5_20260823
baseline_checkpoint: output/sana_hypersim_metric_depth_lr1e5_20260822/checkpoint-500/lora.pt

model:
  name: sana-600m-512px
  model_id: Efficient-Large-Model/Sana_600M_512px_diffusers
  dtype: float16
  resolution: 512

lora:
  rank: 16
  alpha: 32
  rs_lora: true

data:
  dir: data/kitti_metric_512
  pair_manifest: data/kitti_metric_512/pairs.jsonl
  resolution: 512
  vision_ratio: 1.0
  num_workers: 0
  tasks: [depth]
  task_weights: uniform

training:
  steps: 500
  batch_size: 1
  gradient_accumulation: 8
  lr: 1.0e-5
  max_grad_norm: 1.0
  seed: 42
  gradient_checkpointing: true

scheduler:
  type: cosine
  warmup_ratio: 0.05

flow:
  img2img_flow: true
  sigma: 0.0
  logit_normal_timesteps: true
  min_snr: true
  min_snr_gamma: 5.0
  cfg_dropout_rate: 0.1

ema:
  enabled: true
  decay: 0.9999
  warmup_steps: 100

checkpoint:
  output_dir: output/sana_kitti_metric_depth_lr1e5_20260823
  save_every: 100
  eval_every: 500
  log_every: 50

device: mps
