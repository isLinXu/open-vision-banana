# Mixed indoor+outdoor metric replay. Starts from the KITTI outdoor LoRA
# (checkpoint-300 if ETH3D/NYU selection prefers it, else 400) and replays
# 200 Hypersim + 298 KITTI pairs so the 0–10m colormap band is not forgotten.
# Keep paper Eq.1 (λ=-3, c=10/3). Do not lengthen the pure-KITTI 400-run.
# Do not train on ETH3D courtyard/electro or KITTI val drives.
experiment: sana_metric_mixed_replay_lr1e5_20260823
baseline_checkpoint: output/sana_kitti_metric_depth_lr1e5_20260823/checkpoint-300/lora.pt

model:
  name: sana-600m-512px
  model_id: Efficient-Large-Model/Sana_600M_512px_diffusers
  dtype: float16
  resolution: 512

lora:
  rank: 16
  alpha: 32
  rs_lora: true

data:
  dir: data/metric_mixed_replay_512
  pair_manifest: data/metric_mixed_replay_512/pairs.jsonl
  resolution: 512
  vision_ratio: 1.0
  num_workers: 0
  tasks: [depth]
  task_weights: uniform

training:
  steps: 200
  batch_size: 1
  gradient_accumulation: 8
  lr: 1.0e-5
  max_grad_norm: 1.0
  seed: 42
  gradient_checkpointing: true

scheduler:
  type: cosine
  warmup_ratio: 0.05

flow:
  img2img_flow: true
  sigma: 0.0
  logit_normal_timesteps: true
  min_snr: true
  min_snr_gamma: 5.0
  cfg_dropout_rate: 0.1

ema:
  enabled: true
  decay: 0.9999
  warmup_steps: 50

checkpoint:
  output_dir: output/sana_metric_mixed_replay_lr1e5_20260823
  save_every: 100
  eval_every: 200
  log_every: 10

device: mps
