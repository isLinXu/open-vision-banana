# Issue #88 T3: semantic + instance + referring + generation replay (25% each).
# Same recipe as qwen_image_21_main_depth_reasoning.yaml except tasks / vision_ratio / checkpoint cadence.
# Continue the pinned E2b final ONLINE adapter for 10k steps with --resume (weights only, fresh optimizer and
# schedule): khazic/ovb-e2b_cap10k_s42_20261026_1016 @ 036bc7285371e24b9e52ab1b0ad9aea9ea337f27,
# ckpt/checkpoint-10000_final. Tasks are selected from the frozen full manifest of docs/main_depth_reasoning.md.
# Global batch 32 = batch_size * gradient_accumulation * GPU count: override accumulation to 4 on 8 GPUs.
model:
  name: qwen-image-2.1
  dtype: bfloat16
  resolution: 512
lora:
  rank: 32
  alpha: 64
  rs_lora: true
  target_modules:
  - to_q
  - to_k
  - to_v
  - to_out.0
  - img_mlp.proj
  - img_mlp.gate_layer
  - img_mlp.out
data:
  tasks:
  - semantic
  - instance
  - referring
  - generation
  task_sampling: uniform
  task_sampling_weights: {}
  vision_ratio: 0.75
  depth_curve: metric_power
  depth_colormaps:
  - cube_edge
  - plasma
  - inferno
  - viridis
  - grayscale
  semantic_prompt_styles:
  - json_named
  - json_tuple
  - natural
  - hex
  semantic_color_remap_prob: 0.5
  aspect_preserving_crop: true
  num_workers: 4
  dir: data/qwen_main_depth_reasoning
  pair_manifest: data/qwen_main_depth_reasoning/pairs.jsonl
training:
  steps: 10000
  batch_size: 1
  gradient_accumulation: 32
  lr: 3.0e-05
  max_grad_norm: 1.0
  drop_grad_norm: 10.0
  seed: 42
  gradient_checkpointing: true
optimizer:
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.999
  eps: 1.0e-08
scheduler:
  type: cosine
  warmup_steps: 500
validation:
  max_samples_per_task: 40
flow:
  img2img_flow: true
  sigma: 0.0
  logit_normal_timesteps: true
  shift: 1.0
  min_snr: false
  cfg_dropout_rate: 0.05
loss:
  task_loss_weights:
    depth: 1.0
    normal: 1.0
    semantic: 1.0
    instance: 1.0
    referring: 1.0
  normal_angular_loss_weight: 0.0
  depth_edge_aux_weight: 0.0
ema:
  enabled: true
  decay: 0.9999
  warmup_steps: 500
checkpoint:
  output_dir: output/qwen_image_21_ablation_seg_replay
  save_every: 2000
  eval_every: 2500
  log_every: 50
  resume_weights_only: true
wandb:
  enabled: true
  project: open-vision-banana
device: cuda
