# Full-data depth refinement from the validated specialist.  This is a pure
# depth run: all 5,813 manifest-backed training rows are eligible and no
# generation-preservation samples are mixed into the objective.
experiment: sana_depth_gate_full_refine_lr2e6_20260816
resume_checkpoint: output/sana_depth_gate_full_refine_lr1e5_20260814/checkpoint-3000_best/lora.pt
baseline_validation_128:
  relative_position_spearman_r: 0.7778172084945254
  relative_position_pearson_r: 0.7903960332623683
  rgb_mae: 0.19878644961863756
acceptance:
  relative_position_spearman_r_min: 0.785
  relative_position_pearson_r_min: 0.79
  rgb_mae_max: 0.1988

model:
  name: sana-600m-512px
  dtype: float16
  resolution: 512

lora:
  rank: 16
  alpha: 32
  rs_lora: true

data:
  dir: data/vb_snvc_train_v5_full
  pair_manifest: output/mar_vb_clean_pairs_v4/pairs.jsonl
  resolution: 512
  vision_ratio: 1.0
  num_workers: 0
  tasks:
    - depth
  task_weights: sqrt

training:
  steps: 6000
  batch_size: 1
  gradient_accumulation: 1
  lr: 2.0e-6
  max_grad_norm: 1.0
  seed: 42

scheduler:
  type: constant
  warmup_steps: 100

flow:
  img2img_flow: true
  sigma: 0.0
  logit_normal_timesteps: true
  min_snr: false
  cfg_dropout_rate: 0.0

ema:
  decay: 0.9999
  warmup_steps: 500

checkpoint:
  output_dir: output/sana_depth_gate_full_refine_lr2e6_20260816
  save_every: 500
  eval_every: 1000
  log_every: 10

device: mps
