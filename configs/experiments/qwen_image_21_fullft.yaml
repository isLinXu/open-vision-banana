# Full-parameter SFT on Qwen-Image-2.1 (docs/EXPERIMENT_PLAN_FULLFT_VS_LORA.md F1).
# Compared with LoRA r32: the only intended variable is tune_mode / lr.
# Global batch 32 = batch_size * gradient_accumulation * GPU count; override
# accumulation to 4 on 8 GPUs. Needs multi-GPU ZeRO/FSDP-class memory for 7B DiT.
model:
  name: qwen-image-2.1
  dtype: bfloat16
  resolution: 512

lora:
  rank: 32
  alpha: 64
  rs_lora: true
  target_modules:
    - to_q
    - to_k
    - to_v
    - to_out.0
    - img_mlp.proj
    - img_mlp.gate_layer
    - img_mlp.out

data:
  tasks: [depth, semantic, instance, referring, generation]
  task_sampling: uniform
  task_sampling_weights: {}
  vision_ratio: 0.9
  depth_curve: metric_power
  depth_colormaps: [cube_edge]
  semantic_prompt_styles: [json_named, json_tuple, natural, hex]
  semantic_color_remap_prob: 0.5
  aspect_preserving_crop: true
  num_workers: 4

training:
  tune_mode: full
  objective: sft
  steps: 10000
  batch_size: 1
  gradient_accumulation: 32
  lr: 1.0e-5
  max_grad_norm: 1.0
  drop_grad_norm: 10.0
  seed: 42
  gradient_checkpointing: true

optimizer:
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.999
  eps: 1.0e-8

scheduler:
  type: cosine
  warmup_steps: 500

validation:
  max_samples_per_task: 40

flow:
  img2img_flow: true
  sigma: 0.0
  logit_normal_timesteps: true
  shift: 1.0
  min_snr: false
  cfg_dropout_rate: 0.05

loss:
  task_loss_weights: {depth: 1.0, semantic: 1.0, instance: 1.0, referring: 1.0}
  normal_angular_loss_weight: 0.0
  depth_edge_aux_weight: 0.0

ema:
  enabled: true
  decay: 0.9999
  warmup_steps: 500

checkpoint:
  output_dir: output/qwen_image_21_fullft
  save_every: 2000
  eval_every: 2000
  log_every: 50

wandb:
  enabled: true
  project: open-vision-banana

device: cuda
