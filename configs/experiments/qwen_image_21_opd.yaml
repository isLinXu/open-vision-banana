# On-policy distillation of task specialists into one Qwen-Image-2.1 student.
# Train the three SFT specialists first:
#   configs/experiments/qwen_image_21_specialist_{depth,2d,generation}.yaml
# then point each teacher at the checkpoint dir that contains lora.pt
# (typically output/specialists/<name>/checkpoint-*_final). Semantic and
# referring share the 2D specialist; identical paths are loaded once.
# Use "self" only for plumbing tests.
# Gate: python scripts/check_experiment_gates.py post --config <this file>
model:
  name: qwen-image-2.1
  dtype: bfloat16
  resolution: 512

lora:
  rank: 32
  alpha: 64
  rs_lora: true
  target_modules:
    - to_q
    - to_k
    - to_v
    - to_out.0
    - img_mlp.proj
    - img_mlp.gate_layer
    - img_mlp.out

data:
  tasks: [depth, semantic, referring, generation]
  task_sampling: uniform
  task_sampling_weights: {}
  vision_ratio: 0.75
  depth_curve: metric_power
  depth_colormaps: [cube_edge]
  semantic_prompt_styles: [json_named, json_tuple, natural, hex]
  semantic_color_remap_prob: 0.5
  aspect_preserving_crop: true
  num_workers: 4

training:
  tune_mode: lora
  objective: opd
  steps: 5000
  batch_size: 1
  gradient_accumulation: 32
  lr: 1.0e-4
  max_grad_norm: 1.0
  drop_grad_norm: 10.0
  seed: 42
  gradient_checkpointing: true

post_training:
  teachers:
    depth: output/specialists/depth
    semantic: output/specialists/2d
    referring: output/specialists/2d
    generation: output/specialists/generation
  rollout_steps: 8
  train_timesteps: 2
  offload_teachers: true

optimizer:
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.999
  eps: 1.0e-8

scheduler:
  type: cosine
  warmup_ratio: 0.05

validation:
  max_samples_per_task: 40

flow:
  img2img_flow: true
  sigma: 0.0
  logit_normal_timesteps: true
  shift: 1.0
  min_snr: false
  cfg_dropout_rate: 0.0

loss:
  task_loss_weights: {depth: 1.0, semantic: 1.0, referring: 1.0}
  normal_angular_loss_weight: 0.0
  depth_edge_aux_weight: 0.0

ema:
  enabled: true
  decay: 0.9999
  warmup_steps: 500

checkpoint:
  output_dir: output/qwen_image_21_opd
  save_every: 500
  eval_every: 500
  log_every: 25

wandb:
  enabled: true
  project: open-vision-banana

device: cuda
