# MPS training config
# ================================
# Tuned for Apple Silicon (MPS) with 137GB unified memory

# Base model
model:
  name: "black-forest-labs/FLUX.1-schnell"
  dtype: "bfloat16"

# LoRA config (rsLoRA)
lora:
  rank: 64
  alpha: 128
  rs_lora: true
  target_modules:
    - "to_k"
    - "to_v"
  dropout: 0.0

# Optimizer
optimizer:
  lr: 5.0e-5
  weight_decay: 0.01
  scheduler: "cosine"
  warmup_steps: 500
  max_grad_norm: 1.0

# Output
output_dir: "output/checkpoints"

# Logging (W&B disabled on MPS for now, local TensorBoard)
logging:
  wandb_enabled: false
  wandb_project: "open-vision-banana-mps"
  wandb_log_checkpoints: false
  tensorboard_enabled: true
  tensorboard_dir: "output/runs"
  run_name: "mps_flux_depth"

# Training parameters (tuned for MPS)
training:
  epochs: 5
  gradient_accumulation_steps: 8       # emulates batch_size=8
  use_amp: true
  use_ema: true
  ema_decay: 0.9999
  ema_warmup_steps: 2000
  save_every: 500
  eval_every: 250
  max_keep: 5
  seed: 42
  log_every: 10
  early_stopping_patience: null
  early_stopping_min_delta: 0.0

# Data (tuned for MPS)
data:
  vision_ratio: 0.1
  generation_ratio: 0.9
  resolution: 512
  batch_size: 1                        # conservative on MPS; 137GB is available but kept safe
  num_workers: 0                       # must be 0 on MPS to avoid hanging worker processes
  augmentation: true
  val_split: 0.1
  generation_path: "data/vb_generation_5k"

  # training task data
  tasks:
    depth_estimation:
      datasets:
        - name: "vb_depth_300"
          split: "train"

# Depth RGB mapping parameters
depth_mapping:
  lam: -3.0
  c: 3.333

normal_mapping: {}

segmentation:
  color_tolerance: 14.0
  min_area_fraction: 2.0e-4
  erosion_threshold: 0.1
  bbox_expansion_factor: 5.0
