# FLUX.1-schnell training config with local weights
# ================================
# LoRA instruction tuning on locally downloaded FLUX.1-schnell weights
# Target device: Apple M3 Max (128GB unified memory, MPS)

# Base model: local path
model:
  name: "black-forest-labs/FLUX.1-schnell"
  dtype: "bfloat16"

# LoRA config (rsLoRA scaling)
lora:
  rank: 64
  alpha: 128
  rs_lora: true
  target_modules:
    - "to_k"
    - "to_v"
  dropout: 0.0

# Optimizer
optimizer:
  lr: 5.0e-5
  weight_decay: 0.01
  scheduler: "cosine"
  warmup_steps: 100
  max_grad_norm: 1.0

# Output
output_dir: "output/checkpoints_flux_local"

# Logging (local TensorBoard on MPS)
logging:
  wandb_enabled: false
  wandb_project: "open-vision-banana-flux-local"
  wandb_log_checkpoints: false
  tensorboard_enabled: true
  tensorboard_dir: "output/runs_flux_local"
  run_name: "flux_local_depth"

# Training parameters (tuned for 128GB MPS)
training:
  epochs: 3
  gradient_accumulation_steps: 4       # effective batch_size = 1 * 4 = 4
  use_amp: false                       # MPS autocast causes dtype mismatch; all inputs already bfloat16
  use_ema: true
  ema_decay: 0.9999
  ema_warmup_steps: 500
  save_every: 200
  eval_every: 100
  max_keep: 3
  seed: 42
  log_every: 10
  early_stopping_patience: null
  early_stopping_min_delta: 0.0

# Data (tuned for MPS)
data:
  vision_ratio: 0.1                    # 10% vision, 90% generation
  generation_ratio: 0.9
  resolution: 512
  batch_size: 1                        # conservative on MPS, FLUX 12B model
  num_workers: 0                       # must be 0 on MPS
  augmentation: true
  val_split: 0.1                       # 10% validation set
  generation_path: "data/vb_generation_5k"

  # training task data
  tasks:
    depth_estimation:
      datasets:
        - name: "vb_depth_pseudo_5k"
          split: "train"

# Depth RGB mapping parameters (from paper)
depth_mapping:
  lam: -3.0
  c: 3.333

normal_mapping: {}

segmentation:
  color_tolerance: 14.0
  min_area_fraction: 2.0e-4
  erosion_threshold: 0.1
  bbox_expansion_factor: 5.0
