# ================================
# Phase 2: depth gate overfit experiment
# Trains on depth data only (2181 samples)
# Goal: check that FLUX.1+LoRA can learn the image→depth RGB mapping
# ================================

model:
  name: "black-forest-labs/FLUX.1-schnell"
  dtype: "bfloat16"

lora:
  rank: 64
  alpha: 128
  rs_lora: true
  target_modules:
    - "to_k"
    - "to_v"
  dropout: 0.0

optimizer:
  lr: 1.0e-4           # slightly higher LR to overfit faster
  weight_decay: 0.01
  scheduler: "cosine"
  warmup_steps: 50
  max_grad_norm: 1.0

output_dir: "output/flux_depth_gate"

logging:
  wandb_enabled: false
  tensorboard_enabled: true
  tensorboard_dir: "output/runs"
  run_name: "depth_gate"

training:
  epochs: 1
  gradient_accumulation_steps: 1    # no gradient accumulation, faster experiment
  use_amp: true
  use_ema: false                    # the overfit experiment needs no EMA
  save_every: 100
  eval_every: 9999
  max_keep: 5
  seed: 42
  log_every: 10
  early_stopping_patience: null
  early_stopping_min_delta: 0.0

data:
  vision_ratio: 1.0                 # 100% vision data
  resolution: 512
  batch_size: 1
  num_workers: 0
  augmentation: true
  val_split: 0.05                   # 5% validation

depth_mapping:
  lam: -3.0
  c: 3.333

normal_mapping: {}

segmentation:
  color_tolerance: 14.0
  min_area_fraction: 2.0e-4
  erosion_threshold: 0.1
  bbox_expansion_factor: 5.0
