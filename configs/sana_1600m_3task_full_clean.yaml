# Open-Vision-Banana: Sana_1600M full three-task training (depth+normal+seg)
# Uses the cleaned manifest (pairs_5task_v3_clean.jsonl)
# Fixes the task alias mapping: semantic → seg

model:
  name: sana-1600m
  model_id: Efficient-Large-Model/Sana_1600M_512px_diffusers
  dtype: bfloat16
  resolution: 512

lora:
  rank: 32
  alpha: 64
  rs_lora: true
  target_modules:
    - linear
    - proj_out
    - conv_inverted
    - conv_point

data:
  dir: /media/linxu/thinkHub/datasets/open-vision-banana-snvc-train-full
  pair_manifest: output/snvc_v5full_pairs/pairs_3task_clean.jsonl
  resolution: 512
  vision_ratio: 1.0
  num_workers: 4
  tasks:
    - depth
    - normal
    - seg
  task_weights: sqrt

training:
  steps: 30000
  batch_size: 1
  gradient_accumulation: 32
  lr: 5.0e-5
  max_grad_norm: 1.0
  seed: 42
  gradient_checkpointing: true

scheduler:
  type: cosine
  warmup_ratio: 0.05
  warmup_steps: null

flow:
  img2img_flow: true
  sigma: 0.0
  logit_normal_timesteps: true
  min_snr: true
  min_snr_gamma: 5.0
  cfg_dropout_rate: 0.1

loss:
  task_loss_weights: "depth=1.0,normal=2.0,semantic=1.5"
  normal_angular_loss_weight: 0.3

ema:
  enabled: true
  decay: 0.9999
  warmup_steps: 500

checkpoint:
  output_dir: output/sana_1600m_3task_full_clean
  save_every: 1000
  eval_every: 500
  log_every: 50

wandb:
  enabled: true
  project: open-vision-banana
  run_name: sana1600m-3task-depth-normal-seg

device: cuda
resume: null
