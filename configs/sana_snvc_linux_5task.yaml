# Open-Vision-Banana -- Sana_600M_512px five-task training (depth+normal+structure+seg+normal_from_depth)
# Continues from the four-task run's best checkpoint (weights only)
# and adds high-quality normal pseudo-labels derived from depth maps.

model:
  name: sana-600m-512px
  model_id: Efficient-Large-Model/Sana_600M_512px_diffusers
  dtype: bfloat16
  resolution: 512

lora:
  rank: 32
  alpha: 64
  rs_lora: true
  target_modules:
    - linear
    - proj_out
    - conv_inverted
    - conv_point

data:
  dir: /media/linxu/thinkHub/datasets/open-vision-banana-snvc-train-full
  pair_manifest: output/snvc_v5full_pairs/pairs_5task.jsonl
  resolution: 512
  vision_ratio: 1.0
  num_workers: 4
  tasks:
    - depth
    - normal
    - structure
    - seg
  task_weights: sqrt

training:
  steps: 10000
  batch_size: 4
  gradient_accumulation: 8
  lr: 5.0e-5
  max_grad_norm: 1.0
  seed: 42
  gradient_checkpointing: true

scheduler:
  type: cosine
  warmup_ratio: 0.05
  warmup_steps: null

flow:
  img2img_flow: true
  sigma: 0.0
  logit_normal_timesteps: true
  min_snr: true
  min_snr_gamma: 5.0
  cfg_dropout_rate: 0.1

ema:
  enabled: true
  decay: 0.9999
  warmup_steps: 500

checkpoint:
  output_dir: output/sana_snvc_v5full_5task
  save_every: 1000
  eval_every: 500
  log_every: 50

device: cuda
resume: null
