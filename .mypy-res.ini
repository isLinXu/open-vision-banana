[mypy]
python_version = 3.10
ignore_missing_imports = True
no_strict_optional = True
check_untyped_defs = True
show_error_codes = True
warn_unused_ignores = True
warn_redundant_casts = True
# Check the explicitly listed RES modules, including their mutual contracts.
# The repository-wide mypy job still checks the rest of src/. Do not expand
# this focused job into third-party Torch/NumPy source and stub analysis.
follow_imports = skip
follow_imports_for_stubs = True
disable_error_code = index,operator,arg-type,call-overload
